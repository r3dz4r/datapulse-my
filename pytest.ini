[pytest]
# Several tests in this suite build a clone of a working repository inside
# tmp_path, and one passing run was measured leaving 8.2 GB behind: the clone
# carries the full object store plus the tracked attestation archive. pytest
# keeps three such run roots by default, which reached 24 GB on this host.
#
# Keep the trees of failing runs only. A green run then leaves nothing to
# inspect, and a red one keeps everything needed to debug it.
tmp_path_retention_policy = failed
