name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "README.md"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"
      - "datapulse.json"
      - "datapulse.schema.json"
      - "health.schema.json"
      - "agent.json"
      - "mcp.json"
      - "catalog-snapshot.json"
      - "changelog.json"
      - "deltas/**"
      - "record-evidence/**"
      - "record-evidence.schema.json"
      - "health/latest.json"
      - "badges/**"
      - "samples/**"
      - "data/**"
      - "mcp/server.py"
      - "mcp/requirements.txt"
      - "scripts/verify_agent_ready.sh"
      - "scripts/verify_release_invariants.sh"
      - "scripts/generate.sh"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly dataset health check"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Two named concurrency groups, dynamic-key on whether the run is a
  # timer/trailer-triggered fast-deploy or a full deploy. Group names:
  #   - pages-fast    ← timer chore(health) pushes (fast path: embed + assemble + deploy)
  #   - pages-deploy  ← full release-build deploys (manual, dispatch, workflow_run)
  #
  # `cancel-in-progress: false` on both — concurrent pushes do NOT cancel each
  # other; they queue. Without this, every 15-min timer race would kill an
  # 8–13 min in-flight manual deploy, and vice-versa.
  group: >-
    ${{ (github.event_name == 'push'
          && endsWith(github.event.head_commit.message, '[skip deploy]'))
        && 'pages-fast' || 'pages-deploy' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Full deploy job. Both fast-path (timer chore(health)) and full-path
    # (manual/dispatch/weekly) runs land here; the fast path skips the heavy
    # release-build regeneration because the timer already generated and
    # committed all artifacts. We only need to re-embed the fresh dashboard
    # data into docs/index.html, then assemble + deploy (~2-3 min instead of
    # 8-13 min).
    #
    # Trigger gating:
    #   - workflow_run: only run when the upstream health check succeeded
    #   - push: always run (both timer fast-path and manual full-path)
    # The per-step `if:` on the release-build step distinguishes the two paths.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: >-
        ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Check out updated default branch
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Capture deployed source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install release verification dependencies
        run: python -m pip install jsonschema --requirement mcp/requirements.txt

      # Fast path (timer chore(health) pushes): the timer already generated and
      # committed health/latest.json + history/deltas + badges + RSS + catalog snapshot + README summary.
      # We only need to re-embed the fresh dashboard data into docs/index.html,
      # then assemble + deploy. This is ~2-3 min vs 8-13 min for full release-build.
      - name: Embed fresh dashboard data (fast path)
        if: github.event_name == 'push' && endsWith(github.event.head_commit.message, '[skip deploy]')
        run: python3 scripts/embed_dashboard_data.py

      - name: Run release-build generation profile (full path)
        if: github.event_name != 'push' || !endsWith(github.event.head_commit.message, '[skip deploy]')
        run: bash scripts/generate.sh release-build

      - name: Assemble Pages artifact
        run: |
          # GitHub Pages CDN serves `Cache-Control: max-age=600` for all artifacts.
          # Browsers honor the no-cache meta tags in <head>, which force re-validation
          # on every page load. The CDN cache means a deploy takes up to 10 minutes
          # to propagate globally; the browser cache (via meta tags) is bypassed.
          # This is the standard GH Pages + CDN pattern.
          mkdir -p _site
          # All files inside docs/ are copied to the site ROOT (the `docs/`
          # prefix is stripped by `cp -R docs/. _site/`). So docs/index.html
          # becomes https://data-pulse.my/index.html, docs/foo.md becomes
          # https://data-pulse.my/foo.md, etc. URLs in the landing page and
          # README should NOT include the `docs/` prefix.
          cp -R docs/. _site/
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json datapulse.schema.json health.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json _site/
          cp -R health deltas record-evidence badges samples data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 25

      - name: Deploy dashboard (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry 2
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 25

      - name: Deploy dashboard (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Post-deploy release invariants
        env:
          DEPLOYED_SHA: ${{ steps.source.outputs.sha }}
          DATAPULSE_AGENT_BASE_URL: https://data-pulse.my
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error title=Post-deploy release invariant failed::$1"
            exit 1
          }

          fetch() {
            local surface="$1"
            local url="$2"
            local output="$3"
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "$url" --output "$output" || fail "$surface could not be fetched from $url"
          }

          git fetch --no-tags --depth=1 origin main || \
            fail "deployed source branch could not be fetched"
          git checkout --detach "$DEPLOYED_SHA" || \
            fail "deployed source SHA $DEPLOYED_SHA could not be checked out"
          [[ "$(git rev-parse HEAD)" == "$DEPLOYED_SHA" ]] || \
            fail "checked-out SHA does not match deployed SHA $DEPLOYED_SHA"

          expected_dataset_count="$(
            jq -er '.datasets | select(type == "array" and length > 0) | length' \
              health/latest.json
          )" || fail "checked-out health/latest.json has no dataset array"

          sleep 30
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          fetch "dashboard" "https://data-pulse.my/" "$smoke_dir/index.html"
          grep -Fq "$expected_dataset_count" "$smoke_dir/index.html" || \
            fail "dashboard does not mention $expected_dataset_count datasets"
          card_count="$(grep -o '"health_report":' "$smoke_dir/index.html" | wc -l || true)"
          [[ "$card_count" -eq "$expected_dataset_count" ]] || \
            fail "dashboard embeds $card_count dataset cards; expected $expected_dataset_count"

          fetch "llms.txt" "https://data-pulse.my/llms.txt" "$smoke_dir/llms.txt"
          grep -Eq "$expected_dataset_count (official )?datasets|$expected_dataset_count-dataset" "$smoke_dir/llms.txt" || \
            fail "llms.txt does not contain '$expected_dataset_count datasets'"
          grep -Fq "MCP" "$smoke_dir/llms.txt" || \
            fail "llms.txt does not mention MCP"
          for tool in search_datasets get_dataset find_stale get_provenance find_by_licence; do
            grep -Fq "$tool" "$smoke_dir/llms.txt" || \
              fail "llms.txt is missing MCP tool $tool"
          done

          fetch "JSON-LD catalog" "https://data-pulse.my/data/jsonld/catalog.json" "$smoke_dir/catalog.json"
          jq -e --argjson expected "$expected_dataset_count" \
            '.dataset | type == "array" and length == $expected' \
            "$smoke_dir/catalog.json" >/dev/null || \
            fail "JSON-LD catalog is invalid or does not contain $expected_dataset_count datasets"

          fetch "MCP advertisement" "https://data-pulse.my/mcp.json" "$smoke_dir/mcp.json"
          jq -e '
            [.tools[].name] == [
              "search_datasets",
              "get_dataset",
              "find_stale",
              "get_provenance",
              "find_by_licence"
            ]
          ' "$smoke_dir/mcp.json" >/dev/null || \
            fail "mcp.json is invalid or does not advertise the expected 5 tools"

          fetch "health snapshot" "https://data-pulse.my/health/latest.json" "$smoke_dir/health.json"
          jq -e --argjson expected "$expected_dataset_count" \
            '.datasets | type == "array" and length == $expected' \
            "$smoke_dir/health.json" >/dev/null || \
            fail "health/latest.json is invalid or does not contain $expected_dataset_count datasets"

          bash scripts/verify_agent_ready.sh || \
            fail "verify_agent_ready.sh rejected the deployed agent surfaces"

          DATAPULSE_RELEASE_BASE_URL="https://data-pulse.my" \
            bash scripts/verify_release_invariants.sh || \
            fail "verify_release_invariants.sh rejected the deployed release"
