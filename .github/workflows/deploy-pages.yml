name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"
      - "datapulse.json"
      - "datapulse.schema.json"
      - "health/latest.json"
      - "badges/**"
      - "samples/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inject embedded data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          html_path = Path("docs/index.html")
          html = html_path.read_text(encoding="utf-8")
          try:
              manifest = json.dumps(json.load(open("datapulse.json", encoding="utf-8")))
              health = json.dumps(json.load(open("health/latest.json", encoding="utf-8")))
          except FileNotFoundError:
              manifest, health = "null", "null"

          data = (
              '<script id="embedded-data">\n'
              f'    window.__DATAPULSE_DATA__ = {{health: {health}, manifest: {manifest}}};\n'
              '  </script>'
          )
          marker = '<script id="embedded-data">'
          start = html.find(marker)
          if start >= 0:
              end = html.index("</script>", start) + len("</script>")
              html = html[:start] + data + html[end:]
          else:
              html = html.replace("</body>", f"  {data}\n</body>")

          with html_path.open("w", encoding="utf-8", newline="\n") as output:
              output.write(html)
          PY

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json datapulse.schema.json agent.json mcp.json changelog.json _site/
          cp -R health badges samples data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
