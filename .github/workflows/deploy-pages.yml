name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "README.md"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"
      - "datapulse.json"
      - "datapulse.schema.json"
      - "health.schema.json"
      - "agent.json"
      - "mcp.json"
      - "catalog-snapshot.json"
      - "changelog.json"
      - "deltas/**"
      - "record-evidence/**"
      - "record-evidence.schema.json"
      - "health/**"
      - "attestations/**"
      - ".attestations/**"
      - "docs/.well-known/**"
      - "badges/**"
      - "samples/**"
      - "data/**"
      - "mcp/server.py"
      - "mcp/requirements.txt"
      - "scripts/verify_agent_ready.sh"
      - "scripts/verify_release_invariants.sh"
      - "scripts/generate.sh"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Two named concurrency groups, dynamic-key on whether the run is a
  # timer/trailer-triggered fast-deploy or a full deploy. Group names:
  #   - pages-fast    ← timer chore(health) pushes (fast path: embed + assemble + deploy)
  #   - pages-deploy  ← full release-build deploys (manual, dispatch, workflow_run)
  #
  # Normal pushes supersede an older full deploy in pages-deploy, preventing
  # queued deploys from accumulating. Trailer-tagged health pushes stay in
  # pages-fast and never cancel a run; manual dispatches also never cancel.
  group: >-
    ${{ (github.event_name == 'push'
          && endsWith(github.event.head_commit.message, '[skip deploy]'))
        && 'pages-fast' || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') }}

jobs:
  classify_push:
    name: Classify deploy input
    runs-on: ubuntu-latest
    outputs:
      heartbeat_only: ${{ steps.classify.outputs.heartbeat_only }}
    steps:
      - name: Check out push history
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect heartbeat-only push
        id: classify
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "heartbeat_only=false" >> "$GITHUB_OUTPUT"

          [[ "$HEAD_MESSAGE" == *"[skip deploy]" ]] || exit 0
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || exit 0
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == "health/latest.json" ]] || exit 0

          compare_dir="$(mktemp -d)"
          trap 'rm -rf "$compare_dir"' EXIT
          git show "${BEFORE_SHA}:health/latest.json" > "$compare_dir/before.json" || exit 0
          git show "${AFTER_SHA}:health/latest.json" > "$compare_dir/after.json" || exit 0

          before_heartbeat="$(jq -er '._trust_summary.pipeline_heartbeat_at | select(type == "string")' "$compare_dir/before.json")" || exit 0
          after_heartbeat="$(jq -er '._trust_summary.pipeline_heartbeat_at | select(type == "string")' "$compare_dir/after.json")" || exit 0
          [[ "$before_heartbeat" != "$after_heartbeat" ]] || exit 0

          jq -S 'del(._trust_summary.pipeline_heartbeat_at)' "$compare_dir/before.json" > "$compare_dir/before.normalized.json"
          jq -S 'del(._trust_summary.pipeline_heartbeat_at)' "$compare_dir/after.json" > "$compare_dir/after.normalized.json"
          cmp -s "$compare_dir/before.normalized.json" "$compare_dir/after.normalized.json" || exit 0

          echo "heartbeat_only=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: classify_push
    # Full deploy job. Both fast-path (timer chore(health)) and full-path
    # (manual/dispatch/weekly) runs land here; the fast path skips the heavy
    # release-build regeneration because the timer already generated and
    # committed all artifacts. We only need to re-embed the fresh dashboard
    # data into docs/index.html, then assemble + deploy (~2-3 min instead of
    # 8-13 min).
    #
    # Trigger gating:
    #   - workflow_run: only run when the upstream health check succeeded
    #   - push: suppress only a verified heartbeat-only range
    # The per-step `if:` on the release-build step distinguishes the two paths.
    if: >-
      !cancelled()
      && needs.classify_push.outputs.heartbeat_only != 'true'
      && (github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: >-
        ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Check out updated default branch
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Capture deployed source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install release verification dependencies
        run: python -m pip install jsonschema --requirement mcp/requirements.txt

      # Fast path (timer chore(health) pushes): the timer already generated and
      # committed health/latest.json + history/deltas + badges + RSS + catalog snapshot + README summary.
      # We only need to re-embed the fresh dashboard data into docs/index.html,
      # then assemble + deploy. This is ~2-3 min vs 8-13 min for full release-build.
      - name: Embed fresh dashboard data (fast path)
        if: github.event_name == 'push' && endsWith(github.event.head_commit.message, '[skip deploy]')
        run: python3 scripts/embed_dashboard_data.py

      - name: Preserve served attestation plane (fast path)
        if: github.event_name == 'push' && endsWith(github.event.head_commit.message, '[skip deploy]')
        run: |
          set -Eeuo pipefail

          # A health-only checkout can lag a completed release. Its attestation
          # files are therefore not an authority: preserve the currently served,
          # fully verified plane or stop before we upload any Pages artifact.
          preserved_root="$RUNNER_TEMP/preserved-attestations"
          rm -rf "$preserved_root"
          mkdir -p "$preserved_root/health" \
            "$preserved_root/attestations/latest" \
            "$preserved_root/docs/.well-known"

          fetch_public() {
            local path="$1"
            local output="$2"
            local attempt status
            local max_attempts=3
            local backoff_seconds=1
            mkdir -p "$(dirname "$output")"
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if status="$(curl --fail --silent --show-error --proto '=https' \
                --connect-timeout 10 --max-time 30 --write-out '%{http_code}' \
                "https://data-pulse.my/$path" --output "$output")"; then
                return 0
              fi
              rm -f "$output"
              if [[ ! "$status" =~ ^(000|429|5[0-9]{2})$ || "$attempt" -eq "$max_attempts" ]]; then
                return 1
              fi
              sleep "$backoff_seconds"
              backoff_seconds=$((backoff_seconds * 2))
            done
          }

          fail() {
            echo "::error title=Fast-path attestation preservation failed::$1"
            exit 1
          }

          fetch_public health/latest.json "$preserved_root/health/latest.json"
          fetch_public .well-known/datapulse-probe-keys.json "$preserved_root/docs/.well-known/datapulse-probe-keys.json"
          fetch_public attestations/latest/index.json "$preserved_root/attestations/latest/index.json"
          fetch_public attestations/latest/chain_head.json "$preserved_root/attestations/latest/chain_head.json"
          fetch_public attestations/latest/scores.json "$preserved_root/attestations/latest/scores.json"
          fetch_public attestations/latest/binding.json "$preserved_root/attestations/latest/binding.json"
          fetch_public attestations/chain-index.json "$preserved_root/attestations/chain-index.json"

          binding_date="$(jq -er '.payload.date | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$preserved_root/attestations/latest/binding.json")" || fail "served binding date is invalid"
          jq -e --arg date "$binding_date" '
            .schema == "datapulse/v1/attestation-index"
            and .date == $date
            and .chain_head_ref == ("attestations/" + $date + "/chain_head.json")
            and (.attestations | type == "object" and length > 0)
          ' "$preserved_root/attestations/latest/index.json" >/dev/null || fail "served index is invalid"

          fetch_public "attestations/$binding_date/binding.json" "$preserved_root/attestations/$binding_date/binding.json"
          fetch_public "attestations/$binding_date/chain_head.json" "$preserved_root/attestations/$binding_date/chain_head.json"
          while IFS= read -r reference; do
            [[ "$reference" =~ ^attestations/${binding_date}/[A-Za-z0-9_.-]+\.json$ ]] || fail "served attestation reference is unsafe: $reference"
            fetch_public "$reference" "$preserved_root/$reference"
          done < <(jq -r '.attestations | to_entries[] | .value' "$preserved_root/attestations/latest/index.json")
          while IFS= read -r reference; do
            [[ -z "$reference" ]] && continue
            [[ "$reference" =~ ^attestations/${binding_date}/[A-Za-z0-9_.-]+\.json$ ]] || fail "served Rekor reference is unsafe: $reference"
            fetch_public "$reference" "$preserved_root/$reference"
          done < <(jq -r '.rekor // {} | [.reference_ref, .bundle_ref] | .[] // empty' "$preserved_root/attestations/latest/binding.json")

          python3 scripts/verify_attestation_binding.py --root "$preserved_root"

      - name: Run release-build generation profile (full path)
        if: github.event_name != 'push' || !endsWith(github.event.head_commit.message, '[skip deploy]')
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          bash scripts/generate.sh release-build

      - name: Generate current release reproducibility proof
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_reproducible.py \
            --workdir-root "$RUNNER_TEMP" \
            --output docs/release-verification.md
          python3 scripts/verify_release_reproducible.py \
            --verify-proof docs/release-verification.md

      - name: Assemble Pages artifact
        run: |
          # GitHub Pages CDN serves `Cache-Control: max-age=600` for all artifacts.
          # Browsers honor the no-cache meta tags in <head>, which force re-validation
          # on every page load. The CDN cache means a deploy takes up to 10 minutes
          # to propagate globally; the browser cache (via meta tags) is bypassed.
          # This is the standard GH Pages + CDN pattern.
          mkdir -p _site
          # All files inside docs/ are copied to the site ROOT (the `docs/`
          # prefix is stripped by `cp -R docs/. _site/`). So docs/index.html
          # becomes https://data-pulse.my/index.html, docs/foo.md becomes
          # https://data-pulse.my/foo.md, etc. URLs in the landing page and
          # README should NOT include the `docs/` prefix.
          cp -R docs/. _site/
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json custodians.json datapulse.schema.json health.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json _site/
          cp -R health deltas record-evidence badges samples data _site/
          if [[ -d "$RUNNER_TEMP/preserved-attestations" ]]; then
            # Do not overlay stale checkout proofs onto the verified served plane.
            rm -rf _site/attestations
            cp -R "$RUNNER_TEMP/preserved-attestations/attestations" _site/
          else
            cp -R attestations _site/
          fi
          cp -R .attestations _site/ 2>/dev/null || true
          mkdir -p _site/.well-known
          if [[ -d "$RUNNER_TEMP/preserved-attestations" ]]; then
            cp "$RUNNER_TEMP/preserved-attestations/docs/.well-known/datapulse-probe-keys.json" _site/.well-known/
          else
            cp docs/.well-known/datapulse-probe-keys.json _site/.well-known/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 25

      - name: Deploy dashboard (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry 2
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 25

      - name: Deploy dashboard (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        timeout-minutes: 15
        uses: actions/deploy-pages@v4

      - name: Post-deploy release invariants
        env:
          DEPLOYED_SHA: ${{ steps.source.outputs.sha }}
          DATAPULSE_AGENT_BASE_URL: https://data-pulse.my
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error title=Post-deploy release invariant failed::$1"
            exit 1
          }

          fetch() {
            local surface="$1"
            local url="$2"
            local output="$3"
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "$url" --output "$output" || fail "$surface could not be fetched from $url"
          }

          git fetch --no-tags --depth=1 origin main || \
            fail "deployed source branch could not be fetched"
          git checkout --detach "$DEPLOYED_SHA" || \
            fail "deployed source SHA $DEPLOYED_SHA could not be checked out"
          [[ "$(git rev-parse HEAD)" == "$DEPLOYED_SHA" ]] || \
            fail "checked-out SHA does not match deployed SHA $DEPLOYED_SHA"

          expected_dataset_count="$(
            jq -er '.datasets | select(type == "array" and length > 0) | length' \
              health/latest.json
          )" || fail "checked-out health/latest.json has no dataset array"
          allow_unattested_health="${{ (github.event_name == 'push' && endsWith(github.event.head_commit.message, '[skip deploy]')) && '1' || '0' }}"

          sleep 30
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          fetch "dashboard" "https://data-pulse.my/" "$smoke_dir/index.html"
          grep -Fq "$expected_dataset_count" "$smoke_dir/index.html" || \
            fail "dashboard does not mention $expected_dataset_count datasets"
          card_count="$(grep -o '"health_report":' "$smoke_dir/index.html" | wc -l || true)"
          [[ "$card_count" -eq "$expected_dataset_count" ]] || \
            fail "dashboard embeds $card_count dataset cards; expected $expected_dataset_count"
          if [[ "$allow_unattested_health" == "1" ]]; then
            grep -Fq '"claims":{"artifact_signed":false,"rekor_witnessed":false,"source_truth_verified":false}' "$smoke_dir/index.html" || \
              fail "unattested health deploy does not expose all trust claims as false"
          fi

          fetch "release reproducibility proof" "https://data-pulse.my/release-verification.md" "$smoke_dir/release-verification.md"

          fetch "llms.txt" "https://data-pulse.my/llms.txt" "$smoke_dir/llms.txt"
          grep -Eq "$expected_dataset_count (official )?datasets|$expected_dataset_count-dataset" "$smoke_dir/llms.txt" || \
            fail "llms.txt does not contain '$expected_dataset_count datasets'"
          grep -Fq "MCP" "$smoke_dir/llms.txt" || \
            fail "llms.txt does not mention MCP"
          grep -Fxq '<!-- BEGIN mcp-tools -->' "$smoke_dir/llms.txt" || \
            fail "llms.txt has no generated MCP tools block"
          grep -Fxq '<!-- END mcp-tools -->' "$smoke_dir/llms.txt" || \
            fail "llms.txt has no complete generated MCP tools block"

          fetch "JSON-LD catalog" "https://data-pulse.my/data/jsonld/catalog.json" "$smoke_dir/catalog.json"
          jq -e --argjson expected "$expected_dataset_count" \
            '.dataset | type == "array" and length == $expected' \
            "$smoke_dir/catalog.json" >/dev/null || \
            fail "JSON-LD catalog is invalid or does not contain $expected_dataset_count datasets"

          fetch "MCP advertisement" "https://data-pulse.my/mcp.json" "$smoke_dir/mcp.json"
          jq -e '
            .tools | type == "array" and length > 0 and
            all(.[];
              type == "object" and
              (.name | type == "string" and length > 0) and
              (.description | type == "string" and length > 0) and
              (.inputSchema | type == "object")
            )
          ' "$smoke_dir/mcp.json" >/dev/null || \
            fail "mcp.json has no structurally valid non-empty tool inventory"
          python3 - "$smoke_dir/release-verification.md" "$DEPLOYED_SHA" "$expected_dataset_count" "$smoke_dir/mcp.json" health/latest.json <<'PY'
          import json
          import sys
          from pathlib import Path

          proof, source_sha, dataset_count, mcp_path, health_path = sys.argv[1:]
          health = json.loads(Path(health_path).read_text(encoding="utf-8"))
          tools = json.loads(Path(mcp_path).read_text(encoding="utf-8"))["tools"]
          required = (
              "<!-- generated: scripts/verify_release_reproducible.py; do not hand-edit -->",
              "- Status: `current generated release proof`",
              f"- Source SHA: `{source_sha}`",
              f"- Health checked at: `{health['checked_at']}`",
              f"- Dataset count: `{dataset_count}`",
              f"- MCP tool count: `{len(tools)}`",
              "- Protocol result: `byte-identical isolated release-build runs`",
          )
          contents = Path(proof).read_text(encoding="utf-8")
          missing = [line for line in required if line not in contents]
          if missing:
              raise SystemExit("release proof drift: " + "; ".join(missing))
          PY
          jq -e '
            [.resources[].uri] == [
              "datapulse://index", "datapulse://anomalies", "datapulse://trends", "datapulse://reliability",
              "datapulse://drift", "datapulse://reconciliation", "datapulse://attestations", "datapulse://licences",
              "datapulse://{dataset_id}"
            ]
          ' "$smoke_dir/mcp.json" >/dev/null || fail "mcp.json does not advertise 8 concrete resources plus 1 template"

          fetch "probe key registry" "https://data-pulse.my/.well-known/datapulse-probe-keys.json" "$smoke_dir/keys.json"
          fetch "latest attestation index" "https://data-pulse.my/attestations/latest/index.json" "$smoke_dir/attestation-index.json"
          fetch "latest attestation head" "https://data-pulse.my/attestations/latest/chain_head.json" "$smoke_dir/attestation-head.json"
          fetch "latest trust scores" "https://data-pulse.my/attestations/latest/scores.json" "$smoke_dir/scores.json"
          jq -e --argjson expected "$expected_dataset_count" '.schema == "datapulse/v1/probe-key-registry" and (.keys | length > 0)' "$smoke_dir/keys.json" >/dev/null || fail "key registry is invalid"
          jq -e --argjson expected "$expected_dataset_count" '.schema == "datapulse/v1/attestation-index" and (.attestations | length == $expected)' "$smoke_dir/attestation-index.json" >/dev/null || fail "attestation index is invalid"
          jq -e --argjson expected "$expected_dataset_count" '.schema == "datapulse/v1/daily-chain-head-envelope" and (.dataset_links | length == $expected) and (.chain_head | test("^[0-9a-f]{64}$"))' "$smoke_dir/attestation-head.json" >/dev/null || fail "attestation head is invalid"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/trust-scores" and .methodology_version == 3 and (.datasets | length == $expected) and
            all(.datasets[]; .methodology_version == 3 and ((.components | keys) == (.component_availability | keys)) and
              all(.component_availability[]; (.available | type) == "boolean" and (.reason | IN("measured", "classified", "insufficient_history", "not_applicable", "missing_record", "unknown_status")) and (.available == (.reason | IN("measured", "classified")))))
          ' "$smoke_dir/scores.json" >/dev/null || fail "trust scores are invalid"

          fetch "health snapshot" "https://data-pulse.my/health/latest.json" "$smoke_dir/health.json"
          jq -e --argjson expected "$expected_dataset_count" \
            '.datasets | type == "array" and length == $expected' \
            "$smoke_dir/health.json" >/dev/null || \
            fail "health/latest.json is invalid or does not contain $expected_dataset_count datasets"

          fetch "trend snapshot" "https://data-pulse.my/health/trends.json" "$smoke_dir/trends.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-trends"
            and (.datasets | type == "array" and length == $expected)
            and (.summary.datasets_total == $expected)
            and ((.summary.by_reliability_grade | keys | sort)
              == (["A", "B", "C", "D", "F", "insufficient_data"] | sort))
            and ((.summary.by_reliability_grade | [.[]] | add) == $expected)
          ' "$smoke_dir/trends.json" >/dev/null || \
            fail "health/trends.json is invalid or does not contain $expected_dataset_count datasets"

          fetch "drift snapshot" "https://data-pulse.my/health/drift.json" "$smoke_dir/drift.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-drift"
            and (.datasets | type == "array" and length == $expected)
            and (.summary.datasets_total == $expected)
            and ((.summary.by_verdict | to_entries | map(.value) | add) == $expected)
          ' "$smoke_dir/drift.json" >/dev/null || \
            fail "health/drift.json is invalid or does not contain $expected_dataset_count datasets"

          fetch "reconciliation snapshot" "https://data-pulse.my/health/reconciliation.json" "$smoke_dir/reconciliation.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-reconciliation"
            and (.groups | type == "array")
            and (.summary.groups_total == (.groups | length))
            and (.summary.datasets_total == $expected)
            and (.summary.datasets_grouped + .summary.datasets_single_source == $expected)
            and ((.summary.by_verdict | to_entries | map(.value) | add) == .summary.groups_total)
          ' "$smoke_dir/reconciliation.json" >/dev/null || fail "health/reconciliation.json is invalid or inconsistent with $expected datasets"

          bash scripts/verify_agent_ready.sh || \
            fail "verify_agent_ready.sh rejected the deployed agent surfaces"

          DATAPULSE_RELEASE_BASE_URL="https://data-pulse.my" \
            DATAPULSE_ALLOW_UNATTESTED_HEALTH="$allow_unattested_health" \
            bash scripts/verify_release_invariants.sh || \
            fail "verify_release_invariants.sh rejected the deployed release"
