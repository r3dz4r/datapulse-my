name: Pipeline freshness (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit committed health freshness
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import datetime, timezone

          def check(ok, message):
              print(f"[{'PASS' if ok else 'FAIL'}] {message}")
              return ok

          try:
              health = json.load(open("health/latest.json", encoding="utf-8"))
              rows = health.get("datasets") if isinstance(health, dict) else health
              valid_shape = isinstance(rows, (list, dict))
          except (OSError, json.JSONDecodeError) as exc:
              health, rows, valid_shape = None, [], False
              print(f"[FAIL] health/latest.json parses: {exc}")

          results = [check(valid_shape, "health/latest.json parses and has datasets")]
          if not valid_shape:
              sys.exit(1)

          rows = list(rows.values()) if isinstance(rows, dict) else rows
          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))
          stamps = []
          for row in rows:
              if isinstance(row, dict) and row.get("last_checked"):
                  try:
                      stamps.append(parse(row["last_checked"]))
                  except ValueError:
                      pass
          age = (datetime.now(timezone.utc) - max(stamps)).total_seconds() / 60 if stamps else float("inf")
          results.append(check(age <= 30, f"latest dataset check is within 30m ({age:.1f}m)"))
          results.append(check(len(rows) >= 300, f"dataset count is at least 300 ({len(rows)})"))
          known = {"fresh", "aging", "stale", "discontinued", "degraded", "browser-dependent", "unreachable", "unknown", "unknown-freshness", "reference"}
          unknown = sorted({row.get("status") for row in rows if not isinstance(row, dict) or row.get("status") not in known})
          results.append(check(not unknown, f"all statuses use the known taxonomy ({', '.join(unknown) or 'ok'})"))
          sys.exit(0 if all(results) else 1)
          EOF
