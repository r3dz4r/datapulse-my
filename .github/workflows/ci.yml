name: Pull request CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTFILES_DIR: /home/runner/work/datapulse-my/dotfiles

jobs:
  deterministic-safety-net:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out r3dz4r/dotfiles (contract checks reference dotfiles/system/* and dotfiles/scripts/*)
        uses: actions/checkout@v4
        with:
          repository: r3dz4r/dotfiles
          path: /home/runner/work/datapulse-my/dotfiles
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true
        # Operator must create a fine-grained PAT on github.com/r3dz4r/dotfiles
        # with read-only access to its system/, scripts/, notes/ trees,
        # then add it to r3dz4r/datapulse-my repository secrets as
        # CROSS_REPO_TOKEN. Until that's wired, the 3 dotfiles-coupling
        # contract tests skip with a clear reason.
        # GitHub Actions requires checkout `path:` to live under the workspace,
        # so we co-locate dotfiles inside /home/runner/work/datapulse-my/dotfiles.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Check shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Validate manifest and health schemas
        run: |
          python3 -m jsonschema -i datapulse.json datapulse.schema.json
          python3 -m jsonschema -i health/latest.json health.schema.json

      - name: Run repository-contract and MCP tests
        run: python3 -m pytest -q scripts/tests/ mcp/tests/

      - name: Test local agent-ready verification
        run: bash scripts/tests/test_verify_agent_ready.sh

      - name: Verify repository contract
        run: python3 scripts/verify_repository_contract.py

      - name: Check URL drift and cadence
        run: python3 scripts/check_url_drift.py

      - name: Verify local release invariants
        run: bash scripts/verify_release_invariants.sh --local

      - name: Lint current documentation facts
        run: python3 scripts/fact_lint.py
