name: Pull request CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTFILES_DIR: /home/runner/work/datapulse-my/datapulse-my/.dotfiles

jobs:
  deterministic-safety-net:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out r3dz4r/dotfiles (contract checks reference dotfiles/system/* and dotfiles/scripts/*)
        uses: actions/checkout@v4
        with:
          repository: r3dz4r/dotfiles
          path: /home/runner/work/datapulse-my/datapulse-my/.dotfiles
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        # NOTE: do NOT add continue-on-error here. We want a 403 (insufficient
        # PAT scopes) to fail the workflow loudly so the operator notices
        # and fixes the token. With continue-on-error:true the 3 contract
        # tests silently skip and the CI green-light hides the secret
        # misconfiguration.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install verification dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Check shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Validate manifest and health schemas
        run: |
          python3 -m jsonschema -i datapulse.json datapulse.schema.json
          python3 -m jsonschema -i health/latest.json health.schema.json

      - name: Validate tracked release-proof legacy format
        run: |
          python3 - docs/release-verification.md <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys


          proof_path = Path(sys.argv[1])
          try:
              proof = proof_path.read_text(encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"legacy release proof format: could not read {proof_path}: {error}") from error

          required = {
              "release-proof title": r"^# Release reproducibility verification$",
              "verification timestamp": r"^- Verified at: `[^`\\n]+`$",
              "Source SHA": r"^- Source SHA: `[0-9a-f]{7,64}`$",
              "Profile result": r"^- Profile result: .+$",
              "Total files built": r"^- Total files built: .+$",
              "hash table": r"^\\| Path category \\| File count \\| First-run hash \\| Second-run hash \\| Match\\? \\|$",
              "hash table category row": r"^\\| (?![-: ]+\\|)[^|]+ \\| \\d+ \\|",
              "Reproduction section": r"^## Reproduction$",
          }
          missing = [label for label, pattern in required.items() if re.search(pattern, proof, re.MULTILINE) is None]
          if missing:
              raise SystemExit("legacy release proof format: missing " + "; ".join(missing))
          PY

      - name: Run repository-contract and MCP tests
        run: python3 -m pytest -q scripts/tests/ mcp/tests/

      - name: Test local agent-ready verification
        run: bash scripts/tests/test_verify_agent_ready.sh

      - name: Verify repository contract
        run: python3 scripts/verify_repository_contract.py

      - name: Verify OpenWiki source contract
        run: python3 scripts/verify_openwiki.py

      - name: Check URL drift and cadence
        run: python3 scripts/check_url_drift.py

      - name: Verify local release invariants
        run: bash scripts/verify_release_invariants.sh --local

      - name: Lint current documentation facts
        run: python3 scripts/fact_lint.py
