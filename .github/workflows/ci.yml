name: Pull request CI

on:
  # Gate main pushes; branch pushes are covered by pull_request, avoiding duplicate suites.
  push:
    branches: [main]
  # Gate PR merge refs and prospective merge-group trees independently of main pushes.
  pull_request:
  merge_group:
  # Preserve explicit operator runs.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTFILES_DIR: /home/runner/work/datapulse-my/datapulse-my/.dotfiles

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      health_only: ${{ steps.classify.outputs.health_only }}
      append_only: ${{ steps.classify.outputs.append_only }}
      release_only: ${{ steps.classify.outputs.release_only }}
      changed_paths: ${{ steps.classify.outputs.changed_paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}
          filter: blob:none
          sparse-checkout: scripts/classify_change.py
          sparse-checkout-cone-mode: false
      - id: classify
        env:
          # A push's before SHA bounds the changed range; it is not an accepted merge base.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          echo "health_only=false" >> "$GITHUB_OUTPUT"
          echo "append_only=false" >> "$GITHUB_OUTPUT"
          echo "release_only=false" >> "$GITHUB_OUTPUT"
          echo "changed_paths=(diff unavailable)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::Push diff unavailable: before commit ${BEFORE_SHA} is absent from checkout; running full verification" >&2
              exit 0
            fi
            diff_args=("$BEFORE_SHA" HEAD)
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            # A gate judges the checkout tree against its own base, never a frozen event base.
            BASE_SHA=$(git rev-parse --verify 'HEAD^1^{commit}') || {
              echo "::error::Cannot resolve the checked-out merge tree's base (HEAD^1)" >&2
              exit 1
            }
            diff_args=("$BASE_SHA" HEAD)
          else
            exit 0
          fi
          changed_paths=$(git diff --name-only "${diff_args[@]}")
          echo "changed_paths=${changed_paths//$'\n'/, }" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$changed_paths" | python3 scripts/classify_change.py --ci-artifact-profile; then
            echo "health_only=true" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_paths" | python3 scripts/classify_change.py --append-only; then
            echo "append_only=true" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_paths" | python3 scripts/classify_change.py --release-only; then
            echo "release_only=true" >> "$GITHUB_OUTPUT"
          fi

  verify-push-gate-coverage:
    name: Verify every main push has a gate
    needs: [classify, deterministic-safety-net, health-integrity]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require at least one verification gate to have run
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SAFETY_RESULT: ${{ needs.deterministic-safety-net.result }}
          HEALTH_RESULT: ${{ needs.health-integrity.result }}
          HEALTH_ONLY: ${{ needs.classify.outputs.health_only }}
          APPEND_ONLY: ${{ needs.classify.outputs.append_only }}
          RELEASE_ONLY: ${{ needs.classify.outputs.release_only }}
          CHANGED_PATHS: ${{ needs.classify.outputs.changed_paths }}
        run: |
          # The invariant is measured on what actually ran, not inferred from the profile
          # flags: a profile can be computed correctly and still leave both gates skipped,
          # which is the defect this job exists for.
          if [[ "$SAFETY_RESULT" != "skipped" || "$HEALTH_RESULT" != "skipped" ]]; then
            exit 0
          fi
          echo "::error::Push to main verified nothing: safety-net=$SAFETY_RESULT, health-integrity=$HEALTH_RESULT; health_only=$HEALTH_ONLY, append_only=$APPEND_ONLY, release_only=$RELEASE_ONLY; classify=$CLASSIFY_RESULT; changed paths: ${CHANGED_PATHS:-'(diff unavailable)'}. A push must run at least one gate: give these paths a verification profile in scripts/classify_change.py, or widen the gate's condition — do not silence this job." >&2
          exit 1

  deterministic-safety-net:
    needs: classify
    # A skipped required check satisfies branch protection, so only main pushes may skip.
    if: always() && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && needs.classify.outputs.health_only == 'true')
    runs-on: ubuntu-latest
    # 40, not 25: the suite grew past the old ceiling. The append-fork regression file alone
    # walks the 65k-file attestation chain and takes ~8 minutes, so two runs were killed at the
    # boundary and GitHub reports a timed-out job as 'cancelled' — indistinguishable from an
    # external cancel. If this creeps toward the new ceiling, cut the suite's runtime rather
    # than raising it again.
    timeout-minutes: 40
    env:
      ARTIFACT_ONLY_FAST_PATH: ${{ github.event_name == 'pull_request' && needs.classify.outputs.health_only == 'true' }}
      APPEND_ONLY_FAST_PATH: ${{ github.event_name == 'pull_request' && needs.classify.outputs.append_only == 'true' }}
      FULL_VERIFICATION: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.health_only != 'true' && needs.classify.outputs.append_only != 'true') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out r3dz4r/dotfiles (contract checks reference dotfiles/system/* and dotfiles/scripts/*)
        if: env.FULL_VERIFICATION == 'true'
        uses: actions/checkout@v4
        with:
          repository: r3dz4r/dotfiles
          path: /home/runner/work/datapulse-my/datapulse-my/.dotfiles
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        # NOTE: do NOT add continue-on-error here. We want a 403 (insufficient
        # PAT scopes) to fail the workflow loudly so the operator notices
        # and fixes the token. With continue-on-error:true the 3 contract
        # tests silently skip and the CI green-light hides the secret
        # misconfiguration.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Pandoc
        if: env.FULL_VERIFICATION == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install artifact verification dependencies
        if: env.ARTIFACT_ONLY_FAST_PATH == 'true' || env.APPEND_ONLY_FAST_PATH == 'true'
        run: python3 -m pip install jsonschema==4.25.0 cryptography==50.0.0 pytest==8.4.1

      - name: Install verification dependencies
        if: env.FULL_VERIFICATION == 'true'
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Check shell syntax
        if: env.FULL_VERIFICATION == 'true'
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Validate manifest and health schemas
        run: |
          python3 -m jsonschema -i datapulse.json datapulse.schema.json
          python3 -m jsonschema -i health/latest.json health.schema.json

      - name: Verify live documentation counts
        run: python3 scripts/verify_doc_claims.py

      - name: Verify signed chain-head monotonicity
        run: python3 -m pytest -q scripts/tests/test_chain_head_monotonicity.py

      - name: Validate tracked release-proof legacy format
        if: env.FULL_VERIFICATION == 'true'
        run: |
          python3 - docs/release-verification.md <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys


          proof_path = Path(sys.argv[1])
          try:
              proof = proof_path.read_text(encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"legacy release proof format: could not read {proof_path}: {error}") from error

          required = {
              "release-proof title": r"^# Release reproducibility verification$",
              "verification timestamp": r"^- Verified at: `[^`\\n]+`$",
              "Source SHA": r"^- Source SHA: `[0-9a-f]{7,64}`$",
              "Profile result": r"^- Profile result: .+$",
              "Total files built": r"^- Total files built: .+$",
              "hash table": r"^\\| Path category \\| File count \\| First-run hash \\| Second-run hash \\| Match\\? \\|$",
              "hash table category row": r"^\\| (?![-: ]+\\|)[^|]+ \\| \\d+ \\|",
              "Reproduction section": r"^## Reproduction$",
          }
          missing = [label for label, pattern in required.items() if re.search(pattern, proof, re.MULTILINE) is None]
          if missing:
              raise SystemExit("legacy release proof format: missing " + "; ".join(missing))
          PY

      - name: Verify README matches its template before regeneration
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/gen_readme.py --check

      - name: Generate README from canonical inputs
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/gen_readme.py

      - name: Fetch the default branch ref for source-identity derivation
        if: env.FULL_VERIFICATION == 'true'
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          git remote set-head origin --auto
          echo "--- derivation diagnostics"
          echo "shallow: $(git rev-parse --is-shallow-repository)"
          echo "default_ref_commit: $(git rev-parse --verify -q "refs/remotes/origin/${{ github.event.repository.default_branch }}^{commit}" || echo MISSING)"
          echo "origin_head: $(git symbolic-ref -q refs/remotes/origin/HEAD || echo MISSING)"
          echo "newest_mcp_touching: $(git log -1 --format=%H origin/${{ github.event.repository.default_branch }} -- mcp/server.py scripts/gen_per_dataset_receipt.py scripts/verify_per_dataset_receipt.py || echo NONE)"
          echo "head: $(git rev-parse HEAD)"

      - name: Run repository-contract and MCP tests
        if: env.FULL_VERIFICATION == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          # Discovery provenance follows default-branch history. Test the
          # candidate as that branch, otherwise PR-only MCP revisions are invisible.
          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          default_sha=$(git rev-parse --verify "$default_ref")
          trap 'git update-ref "$default_ref" "$default_sha"' EXIT
          git update-ref "$default_ref" HEAD
          python3 -m pytest -q scripts/tests/ mcp/tests/

      - name: Test local agent-ready verification
        if: env.FULL_VERIFICATION == 'true'
        run: bash scripts/tests/test_verify_agent_ready.sh

      - name: Verify repository contract
        run: python3 scripts/verify_repository_contract.py

      - name: Verify licence consistency
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/verify_licence_consistency.py

      - name: Verify immutable attestation append against accepted base
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && env.ARTIFACT_ONLY_FAST_PATH != 'true'
        run: |
          set -Eeuo pipefail
          # A gate judges the checkout tree against its own base, never a frozen event base.
          ACCEPTED_BASE=$(git rev-parse --verify 'HEAD^1^{commit}') || {
            echo "::error::Cannot resolve the checked-out merge tree's base (HEAD^1)" >&2
            exit 1
          }
          python3 scripts/verify_attestation_append.py --base "$ACCEPTED_BASE"

      - name: Verify attestation workflow contract
        if: env.ARTIFACT_ONLY_FAST_PATH != 'true'
        run: python3 scripts/verify_attestation_workflow_contract.py

      - name: Verify public surface has no internal repository references
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/verify_public_internal_refs.py

      - name: Verify MCP quickstart region matches the public-surface contract
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/gen_mcp_quickstart.py --check

      - name: Verify distribution surfaces match canonical evidence
        run: python3 scripts/verify_distribution_sync.py

      - name: Verify release identity consistency
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/release_identity.py --check

      - name: Verify attestation chain forward-linearity seed
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/verify_chain_linearity.py

      - name: Verify OpenWiki source contract
        run: python3 scripts/verify_openwiki.py

      - name: Check URL drift and cadence
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/check_url_drift.py

      - name: Verify local release invariants
        if: env.FULL_VERIFICATION == 'true'
        run: bash scripts/verify_release_invariants.sh --local

      - name: Lint current documentation facts
        if: env.FULL_VERIFICATION == 'true'
        run: python3 scripts/fact_lint.py

      - name: Verify documentation integrity
        if: env.FULL_VERIFICATION == 'true'
        # Promote when a report-only run has no non-REPORT finding on the clean tree.
        run: python3 scripts/verify_documentation.py --report-only

  health-integrity:
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.health_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Chain linearity resolves which append candidate was merged by walking the
          # commit graph; a depth-1 clone cannot answer that and reports a false fork.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install health integrity dependencies
        run: python3 -m pip install jsonschema==4.25.0 cryptography==50.0.0

      - name: Validate health snapshot and attestation lineage
        run: |
          python3 -m jsonschema -i health/latest.json health.schema.json
          python3 scripts/verify_chain_linearity.py
