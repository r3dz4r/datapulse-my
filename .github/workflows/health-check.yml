name: Weekly dataset health check

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      # The VPS-only Tailscale default is unreachable from hosted runners.
      # Set this repository variable if Camofox gains a public endpoint.
      CAMOFOX_BASE_URL: ${{ vars.CAMOFOX_BASE_URL || 'http://100.74.84.121:9377' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTFS probe dependency
        run: python -m pip install --requirement requirements.txt

      - name: Check dataset health
        run: |
          mkdir -p health
          bash scripts/check.sh > health/latest.json

      - name: Run health-cycle generation profile
        run: bash scripts/generate.sh health-cycle

      - name: Commit changed health summary
        run: |
          if [ -z "$(git status --porcelain -- health/ badges/ feed.xml README.md changelog.json)" ]; then
            echo "No health artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/ badges/ feed.xml README.md changelog.json
          git commit -m "chore(health): update weekly dataset health"
          git push
