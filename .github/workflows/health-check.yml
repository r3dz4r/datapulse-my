name: Weekly dataset health check

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      # Camofox lives on the VPS; the Actions runner cannot reach a private
      # Tailscale IP. Leave CAMOFOX_BASE_URL unset unless you have published
      # Camofox via a Tailscale Funnel / Cloudflare Tunnel that the runner
      # can reach. No public IP is encoded in this workflow.
      CAMOFOX_BASE_URL: ${{ vars.CAMOFOX_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTFS probe dependency
        run: python -m pip install --requirement requirements.txt

      - name: Check dataset health
        run: |
          mkdir -p health
          bash scripts/check.sh > health/latest.json

      - name: Run health-cycle generation profile
        run: bash scripts/generate.sh health-cycle

      - name: Commit changed health summary
        run: |
          if [ -z "$(git status --porcelain -- health/ deltas/ record-evidence/ badges/ feed.xml README.md catalog-snapshot.json catalog-graph.json changelog.json attestations/ datapulse.json)" ]; then
            echo "No health artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/ deltas/ record-evidence/ badges/ feed.xml README.md catalog-snapshot.json catalog-graph.json changelog.json attestations/ datapulse.json
          git commit -m "chore(health): update weekly dataset health"
          git push
