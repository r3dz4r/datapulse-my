name: Anchor release attestation

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  anchor:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - run: python -m pip install cryptography==50.0.0
      - name: Fetch and verify latest signed head
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)"
          curl -fsSL "$website_origin/attestations/latest/chain_head.json" -o "$work/head.json"
          curl -fsSL "$website_origin/.well-known/datapulse-probe-keys.json" -o "$work/keys.json"
          python3 - "$work/head.json" "$work/keys.json" <<'PY'
          import base64, json, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          head=json.load(open(sys.argv[1])); keys=json.load(open(sys.argv[2])); payload=head["payload"]
          key=next(row for row in keys["keys"] if row["key_id"]==payload["key_id"])
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(",", ":")).encode()
          Ed25519PublicKey.from_public_bytes(base64.b64decode(key["public_key_base64"])).verify(base64.b64decode(head["signature_base64"]),canonical)
          assert len(head["chain_head"])==64
          PY
          mkdir -p .attestations
          cp "$work/head.json" .attestations/chain_head.json
      - name: Comment anchor trailer on PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail
          head="$(jq -er .chain_head .attestations/chain_head.json)"
          trailer="Attestation-Chain-Head: ${head}"
          if gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[].body' | grep -Fqx "$trailer"; then
            echo "Anchor trailer already posted for ${head}; skipping."
            exit 0
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$trailer"
