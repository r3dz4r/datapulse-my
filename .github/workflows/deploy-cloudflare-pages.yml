name: Deploy canonical dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "health/**"
      - "deltas/**"
      - "record-evidence/**"
      - "attestations/**"
      - ".attestations/**"
      - "badges/**"
      - "samples/**"
      - "data/**"
      - "*.json"
      - "*.xml"
      - "*.txt"
      - "scripts/**"
      - "mcp/**"
      - "config/public-surfaces.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && endsWith(github.event.head_commit.message, '[skip deploy]')
        && 'cloudflare-pages-health' || 'cloudflare-pages-release' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip deploy]') }}

jobs:
  classify:
    name: Classify native Pages input
    runs-on: ubuntu-latest
    outputs:
      health_only: ${{ steps.classify.outputs.health_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          echo "health_only=false" >> "$GITHUB_OUTPUT"
          [[ "${GITHUB_EVENT_NAME}" == "push" ]] || exit 0
          [[ "$HEAD_MESSAGE" == *"[skip deploy]" ]] || exit 0
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || exit 0
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          # Health-cycle generators own: health/**, record-evidence/**/latest.json,
          # attestations/latest/**, .attestations/latest/**, .attestations/chain_head.json,
          # and the catalog, changelog, and feed root outputs below. Any other path,
          # including a source or workflow change, must use the release profile.
          if HEALTH_CYCLE_CHANGED_PATHS="$changed" python3 - <<'PY'
          from __future__ import annotations

          import os


          paths = [path for path in os.environ["HEALTH_CYCLE_CHANGED_PATHS"].splitlines() if path]
          root_outputs = {
              "catalog-graph.json",
              "catalog-snapshot.json",
              "changelog.json",
              "feed.xml",
          }


          def is_health_cycle_output(path: str) -> bool:
              parts = path.split("/")
              if any(part in {"", ".", ".."} for part in parts):
                  return False
              if path.startswith("health/"):
                  return True
              if len(parts) >= 3 and parts[0] == "record-evidence" and parts[-1] == "latest.json":
                  return True
              if path.startswith("attestations/latest/"):
                  return True
              if path == ".attestations/chain_head.json" or path.startswith(".attestations/latest/"):
                  return True
              return path in root_outputs


          raise SystemExit(
              0
              if "health/latest.json" in paths and paths and all(is_health_cycle_output(path) for path in paths)
              else 1
          )
          PY
          then
            echo "health_only=true" >> "$GITHUB_OUTPUT"
          fi

  sign_health:
    needs: classify
    name: Sign current health with public Sigstore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.sigstore_result.outputs.signed }}
      receipts_signed: ${{ steps.per_receipt_result.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate deterministic health attestation statement
        run: |
          set -Eeuo pipefail
          python3 scripts/gen_sigstore_bundle.py \
            --health health/latest.json \
            --manifest datapulse.json \
            --legacy-chain-head .attestations/chain_head.json \
            --source-commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/health.latest.statement.json"

      - name: Install pinned Cosign signer
        id: install_cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Sign and verify current health DSSE bundle
        id: sign_current_health
        if: steps.install_cosign.outcome == 'success'
        continue-on-error: true
        env:
          SIGSTORE_IDENTITY: https://github.com/r3dz4r/datapulse-my/.github/workflows/deploy-cloudflare-pages.yml@refs/heads/main
          SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          publication="$RUNNER_TEMP/sigstore-publication"
          mkdir -p "$publication"
          bundle_tmp="$publication/.health.latest.sigstore.json.tmp"
          cosign attest-blob \
            --yes \
            --statement "$RUNNER_TEMP/health.latest.statement.json" \
            --bundle "$bundle_tmp" \
            health/latest.json
          python3 scripts/verify_sigstore_bundle.py \
            --health health/latest.json \
            --manifest datapulse.json \
            --legacy-chain-head .attestations/chain_head.json \
            --source-commit "$GITHUB_SHA" \
            --bundle "$bundle_tmp" \
            --certificate-identity "$SIGSTORE_IDENTITY" \
            --certificate-oidc-issuer "$SIGSTORE_ISSUER" \
            --cosign "$(command -v cosign)"
          mv "$bundle_tmp" "$publication/health.latest.sigstore.json"
          # Publish the exact sign-time inputs beside the bundle. The manifest
          # snapshot is the canonical verification input; release-build may
          # later regenerate the top-level discovery manifest.
          cp .attestations/chain_head.json "$publication/chain_head.json"
          cp datapulse.json "$publication/datapulse.json"

      - name: Stage statement into Sigstore publication
        run: cp "$RUNNER_TEMP/health.latest.statement.json" "$RUNNER_TEMP/sigstore-publication/"

      - name: Generate per-dataset evidence statements
        run: python3 scripts/gen_per_dataset_receipt.py

      - name: Sign per-dataset evidence statements
        id: sign_per_dataset
        if: steps.install_cosign.outcome == 'success'
        continue-on-error: true
        env:
          SIGSTORE_IDENTITY: https://github.com/r3dz4r/datapulse-my/.github/workflows/deploy-cloudflare-pages.yml@refs/heads/main
          SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          python3 scripts/sign_per_dataset_receipts.py \
            --cosign "$(command -v cosign)" \
            --result-out "$RUNNER_TEMP/per-dataset-receipts.result"
          if [[ "$(cat "$RUNNER_TEMP/per-dataset-receipts.result")" == "signed" ]]; then
            python3 scripts/verify_per_dataset_receipt.py \
              --certificate-identity "$SIGSTORE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_ISSUER" \
              --cosign "$(command -v cosign)"
            publication="$RUNNER_TEMP/sigstore-publication"
            mkdir -p "$publication/data"
            cp data/*.receipt.evidence.json data/*.receipt.statement.json data/*.receipt.sigstore.json "$publication/data/"
          fi

      - name: Record per-dataset receipt result
        id: per_receipt_result
        if: always()
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.sign_per_dataset.outcome }}" == "success" \
             && -f "$RUNNER_TEMP/per-dataset-receipts.result" \
             && "$(cat "$RUNNER_TEMP/per-dataset-receipts.result")" == "signed" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/sigstore-publication/data"
            echo '::warning title=Sigstore per-dataset signing unavailable::Canonical health will be published without per-dataset bundles.'
          fi

      - name: Upload verified optional Sigstore bundle
        id: upload_sigstore
        if: steps.sign_current_health.outcome == 'success' || steps.per_receipt_result.outputs.signed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigstore-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sigstore-publication
          if-no-files-found: error
          retention-days: 1

      - name: Record optional Sigstore result
        id: sigstore_result
        if: always()
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.sign_current_health.outcome }}" == "success" \
             && "${{ steps.upload_sigstore.outcome }}" == "success" \
             && -s "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json"
            rm -f "$RUNNER_TEMP/health.latest.statement.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/chain_head.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/datapulse.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/.health.latest.sigstore.json.tmp"
            echo '::warning title=Sigstore health signing unavailable::Canonical health will be published without a Sigstore bundle; no stale or unverified bundle will be carried forward.'
          fi

  deploy:
    needs: [classify, sign_health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical health snapshot
        run: |
          set -Eeuo pipefail
          jq -e '
            .checked_at | type == "string" and length > 0
          ' health/latest.json >/dev/null
          jq -e '
            .datasets | type == "array" and length > 0
          ' health/latest.json >/dev/null

      - name: Require current per-dataset receipts (health-only path)
        if: needs.classify.outputs.health_only == 'true' && needs.sign_health.outputs.receipts_signed != 'true'
        run: |
          echo '::error title=Cloudflare receipt contract failed::A new health snapshot would not have a current verified per-dataset receipt set.'
          exit 1

      - name: Embed canonical health dashboard (health-only path)
        if: needs.classify.outputs.health_only == 'true'
        run: python3 scripts/embed_dashboard_data.py --health health/latest.json

      - name: Install Pandoc
        if: needs.classify.outputs.health_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install release verification dependencies
        if: needs.classify.outputs.health_only != 'true'
        run: python -m pip install jsonschema --requirement mcp/requirements.txt 'datacontract-cli[duckdb]==0.12.5'

      - name: Run release-build generation profile (non-health path)
        if: needs.classify.outputs.health_only != 'true'
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          export DATAPULSE_SOURCE_COMMIT_SHA="$GITHUB_SHA"
          export DATAPULSE_SOURCE_COMMIT_DATE="$(git show -s --format=%cs "$GITHUB_SHA")"
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          bash scripts/generate.sh release-build

      - name: Generate per-dataset evidence statements (release artifact)
        if: needs.classify.outputs.health_only != 'true'
        run: python3 scripts/gen_per_dataset_receipt.py

      - name: Validate DataPulse contract (non-health path)
        if: needs.classify.outputs.health_only != 'true'
        run: bash scripts/run_datacontract_validation.sh

      - name: Verify full release contract (non-health path)
        if: needs.classify.outputs.health_only != 'true'
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          python3 scripts/verify_release_reproducible.py \
            --workdir-root "$RUNNER_TEMP" \
            --output docs/release-verification.md
          python3 scripts/verify_release_reproducible.py \
            --verify-proof docs/release-verification.md
          bash scripts/verify_release_invariants.sh --local

      - name: Preserve served release proof (health-only path)
        if: needs.classify.outputs.health_only == 'true'
        run: |
          set -Eeuo pipefail
          fail() { echo "::error title=Cloudflare release-proof preservation failed::$1"; exit 1; }
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)" || fail "invalid website origin"
          preserved_proof="$RUNNER_TEMP/preserved-release-proof/release-verification.md"
          rm -rf "$(dirname "$preserved_proof")"
          mkdir -p "$(dirname "$preserved_proof")"
          curl --fail --location --silent --show-error --proto '=https' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${website_origin}/release-verification.md" --output "$preserved_proof" || \
            fail "served release proof could not be fetched"
          test -s "$preserved_proof" || fail "served release proof is empty"
          python3 - "$preserved_proof" <<'PY' || fail "served release proof has an invalid legacy format"
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys

          proof = Path(sys.argv[1]).read_text(encoding="utf-8")
          required = {
              "release-proof title": r"^# Release reproducibility verification$",
              "verification timestamp": r"^- (?:Generated|Verified) at: `[^`\\n]+`$",
              "Source SHA": r"^- Source SHA: `[0-9a-f]{7,64}`$",
              "Profile result": r"^- Profile result: .+$",
              "Total files built": r"^- Total files built: .+$",
              "hash table": r"^\\| Path category \\| File count \\| First-run hash \\| Second-run hash \\| Match\\? \\|$",
              "hash table category row": r"^\\| (?![-: ]+\\|)[^|]+ \\| \\d+ \\|",
              "Reproduction section": r"^## Reproduction$",
          }
          missing = [label for label, pattern in required.items() if re.search(pattern, proof, re.MULTILINE) is None]
          if missing:
              raise SystemExit("legacy release proof format: missing " + "; ".join(missing))
          PY

      - name: Preserve served attestation plane (health-only path)
        if: needs.classify.outputs.health_only == 'true' && needs.sign_health.outputs.signed != 'true'
        run: |
          set -Eeuo pipefail
          # A health-only checkout can lag a completed release. Its attestation
          # files are not authoritative: preserve the currently served verified
          # plane, or stop before a Cloudflare artifact is uploaded.
          fail() { echo "::error title=Cloudflare attestation preservation failed::$1"; exit 1; }
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)" || fail "invalid website origin"
          preserved_root="$RUNNER_TEMP/preserved-attestations"
          rm -rf "$preserved_root"
          mkdir -p "$preserved_root/health" "$preserved_root/attestations/latest" "$preserved_root/docs/.well-known"
          fetch_public() {
            local path="$1" output="$2"
            [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unsafe served path: $path"
            mkdir -p "$(dirname "$output")"
            curl --fail --location --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "${website_origin}/${path}" --output "$output" || fail "served attestation file could not be fetched: $path"
          }
          fetch_public health/latest.json "$preserved_root/health/latest.json"
          fetch_public .well-known/datapulse-probe-keys.json "$preserved_root/docs/.well-known/datapulse-probe-keys.json"
          fetch_public attestations/latest/index.json "$preserved_root/attestations/latest/index.json"
          fetch_public attestations/latest/chain_head.json "$preserved_root/attestations/latest/chain_head.json"
          fetch_public attestations/latest/scores.json "$preserved_root/attestations/latest/scores.json"
          fetch_public attestations/latest/binding.json "$preserved_root/attestations/latest/binding.json"
          fetch_public attestations/chain-index.json "$preserved_root/attestations/chain-index.json"
          binding_date="$(jq -er '.payload.date | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$preserved_root/attestations/latest/binding.json")" || fail "served binding date is invalid"
          index_date="$(jq -er '.date | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$preserved_root/attestations/latest/index.json")" || fail "served index is invalid"
          jq -e --arg date "$index_date" '
            .schema == "datapulse/v1/attestation-index"
            and .date == $date
            and .chain_head_ref == ("attestations/" + $date + "/chain_head.json")
            and (.attestations | type == "object" and length > 0)
          ' "$preserved_root/attestations/latest/index.json" >/dev/null || fail "served index is invalid"
          fetch_public "attestations/$binding_date/binding.json" "$preserved_root/attestations/$binding_date/binding.json"
          fetch_public "attestations/$binding_date/chain_head.json" "$preserved_root/attestations/$binding_date/chain_head.json"
          while IFS= read -r reference; do
            [[ "$reference" =~ ^attestations/${index_date}/[A-Za-z0-9_.-]+\.json$ ]] || fail "served attestation reference is unsafe: $reference"
            fetch_public "$reference" "$preserved_root/$reference"
          done < <(jq -r '.attestations | to_entries[] | .value' "$preserved_root/attestations/latest/index.json")
          while IFS= read -r reference; do
            [[ -z "$reference" ]] && continue
            [[ "$reference" =~ ^attestations/${binding_date}/[A-Za-z0-9_.-]+\.json$ ]] || fail "served Rekor reference is unsafe: $reference"
            fetch_public "$reference" "$preserved_root/$reference"
          done < <(jq -r '.rekor // {} | [.reference_ref, .bundle_ref] | .[] // empty' "$preserved_root/attestations/latest/binding.json")
          if attestation_plane_state="$(python3 scripts/verify_attestation_plane_state.py --planedir "$preserved_root")"; then
            if [[ "$attestation_plane_state" == "signer_down" ]]; then
              echo '::warning title=Signer lane down (P6); attestation failed-closed::Served attestation plane is stale and explicitly reports artifact_signed:false; preserving it unchanged.'
            fi
          else
            if ! python3 scripts/verify_attestation_binding.py --root "$preserved_root"; then
              echo "Attestation cryptographic verification failed; refusing to preserve the served plane."
            fi
            fail "served health/binding plane is inconsistent; Run a full release-build deployment to heal the public trust plane."
          fi

      - name: Download verified optional Sigstore bundle
        if: needs.sign_health.outputs.signed == 'true' || needs.sign_health.outputs.receipts_signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sigstore-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sigstore-publication

      - name: Assemble canonical Pages artifact
        run: |
          set -Eeuo pipefail
          rm -rf _site
          mkdir -p _site/.well-known
          cp -R docs/. _site/
          if [[ -d "$RUNNER_TEMP/preserved-release-proof" ]]; then
            test -s "$RUNNER_TEMP/preserved-release-proof/release-verification.md"
            cp "$RUNNER_TEMP/preserved-release-proof/release-verification.md" _site/release-verification.md
          fi
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json custodians.json datapulse.schema.json health.schema.json agent.schema.json mcp.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json _site/
          cp -R health deltas record-evidence badges samples data _site/
          if [[ "${{ needs.sign_health.outputs.receipts_signed }}" == "true" ]]; then
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.evidence.json _site/data/
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.statement.json _site/data/
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.sigstore.json _site/data/
          fi
          cp -R attestations _site/
          cp -R .attestations _site/
          cp docs/.well-known/datapulse-probe-keys.json _site/.well-known/
          if [[ -d "$RUNNER_TEMP/preserved-attestations" ]]; then
            # The new health bytes cannot inherit a served binding. Preserve the
            # verified historical plane and leave current trust claims fail-closed.
            rm -rf _site/attestations
            cp -R "$RUNNER_TEMP/preserved-attestations/attestations" _site/
            rm -f _site/attestations/latest/binding.json
            cp "$RUNNER_TEMP/preserved-attestations/docs/.well-known/datapulse-probe-keys.json" _site/.well-known/
          fi
          if [[ "${{ needs.sign_health.outputs.signed }}" == "true" ]]; then
            test -s "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json"
            test -s "$RUNNER_TEMP/sigstore-publication/health.latest.statement.json"
            test -s "$RUNNER_TEMP/sigstore-publication/chain_head.json"
            test -s "$RUNNER_TEMP/sigstore-publication/datapulse.json"
            mkdir -p _site/signatures
            cp "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/health.latest.statement.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/chain_head.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/datapulse.json" _site/signatures/
          fi
          test -s _site/index.html
          test ! -e _site/_redirects
          test -s _site/health/latest.json

      - name: Deploy canonical Cloudflare Pages artifact
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=datapulse-p4b-preview --branch=main

      - name: Install pinned Cosign verifier
        if: needs.sign_health.outputs.signed == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Verify canonical served surface
        run: |
          set -Eeuo pipefail
          fail() { echo "::error title=Cloudflare Pages contract failed::$1"; exit 1; }
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)" || fail "invalid website origin"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          fetch() {
            local surface="$1" url="$2" output="$3"
            [[ "$url" =~ ^https://[^[:space:]]+$ ]] || fail "invalid URL for $surface"
            mkdir -p "$(dirname "$output")"
            curl --fail --location --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "$url" --output "$output" || \
              fail "missing or stale served surface: $surface"
          }
          fetch_alias() {
            local surface="$1" url="$2"
            local requested_path="${url#"$website_origin"}"
            local headers="$smoke_dir/${surface// /-}.headers" body="$smoke_dir/${surface// /-}.body" location status
            local resolved_headers="$smoke_dir/${surface// /-}.resolved.headers" resolved_body="$smoke_dir/${surface// /-}.resolved.body"
            [[ "$url" =~ ^https://[^[:space:]]+$ ]] || fail "invalid URL for $surface"
            # Fetch once without following.  Pages may clean-normalise an HTML
            # path.  Only the documented landing.html -> landing transition is
            # allowed; every other Location is a route-contract failure.
            status="$(curl --fail --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")" \
              || fail "could not fetch compatibility alias: $surface"
            location="$(awk 'tolower($1) == "location:" { sub(/[\r ]+$/, "", $2); print $2; exit }' "$headers")"
            # Pages appends a trailing empty fragment to certain Location
            # values; canonicalise the comparison value so a benign `#` does
            # not fail an otherwise-correct alias normalization.
            [[ "$location" == "${location%#}" ]] || location="${location%#}"
            if [[ -n "$location" ]]; then
              [[ "$requested_path" == "/landing.html" && "$status" == "308" ]] \
                || fail "$surface uses an unexpected edge redirect to ${location}"
              [[ "$location" == "/landing" || "$location" == "${website_origin}/landing" ]] \
                || fail "$surface normalizes to an unexpected location: ${location}"
              status="$(curl --fail --silent --show-error --proto '=https' \
                --retry 3 --retry-delay 5 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                --dump-header "$resolved_headers" --output "$resolved_body" --write-out '%{http_code}' \
                "${website_origin}/landing")" \
                || fail "could not fetch normalized compatibility alias: $surface"
              [[ "$status" == "200" ]] || fail "$surface normalized alias returned HTTP $status"
              location="$(awk 'tolower($1) == "location:" { sub(/[\r ]+$/, "", $2); print $2; exit }' "$resolved_headers")"
              [[ -z "$location" ]] || fail "$surface normalized alias redirects again to ${location}"
              body="$resolved_body"
            else
              [[ "$status" == "200" ]] || fail "$surface returned unexpected HTTP $status"
            fi
            grep -Fq '<title>DataPulse dataset register</title>' "$body" || fail "$surface lacks alias document identity"
            grep -Fq '<link rel="canonical" href="/">' "$body" || fail "$surface lacks root canonical identity"
            grep -Fq 'http-equiv="refresh" content="0; url=/"' "$body" || fail "$surface lacks root browser fallback"
            grep -Fq 'href="/">DataPulse dataset register</a>' "$body" || fail "$surface lacks accessible root fallback"
          }
          # Allow the custom-domain edge to observe the just-created Pages deployment.
          sleep 30
          expected_dataset_count="$(jq -er '.datasets | select(type == "array" and length > 0) | length' _site/datapulse.json)" \
            || fail "assembled manifest has no dataset array"
          fetch "dataset register" "${website_origin}/" "$smoke_dir/index.html"
          grep -q "<title>DataPulse Dataset Register</title>" "$smoke_dir/index.html" \
            || fail "origin root is not the DataPulse dataset register"
          grep -q "__DATAPULSE_DATA__" "$smoke_dir/index.html" \
            || fail "origin root has no embedded register health payload"
          observed_register_rows="$(grep -o '<article class="register-row' "$smoke_dir/index.html" | wc -l)"
          [[ "$observed_register_rows" -eq "$expected_dataset_count" ]] \
            || fail "origin root register rows mismatch: expected $expected_dataset_count, observed $observed_register_rows"
          if grep -q "DataPulse MY" "$smoke_dir/index.html"; then
            fail "origin root retains the retired product-name alias"
          fi
          fetch_alias "landing.html" "${website_origin}/landing.html"
          fetch_alias "landing" "${website_origin}/landing"
          fetch_alias "dashboard" "${website_origin}/dashboard"
          fetch "health snapshot" "${website_origin}/health/latest.json" "$smoke_dir/health/latest.json"
          cmp -s _site/health/latest.json "$smoke_dir/health/latest.json" || \
            fail "served canonical health differs from the deployed bytes"
          sigstore_signed="${{ needs.sign_health.outputs.signed }}"
          sigstore_path="signatures/health.latest.sigstore.json"
          if [[ "$sigstore_signed" == "true" ]]; then
            staged_bundle="$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json"
            staged_manifest="$RUNNER_TEMP/sigstore-publication/datapulse.json"
            test -s "$staged_bundle" || fail "verified Sigstore bundle is missing from the deploy job"
            test -s "$staged_manifest" || fail "signed manifest snapshot is missing from the deploy job"
            fetch "Sigstore health DSSE bundle" "${website_origin}/${sigstore_path}" "$smoke_dir/health.latest.sigstore.json"
            cmp -s "$staged_bundle" "$smoke_dir/health.latest.sigstore.json" || \
              fail "served Sigstore bundle differs from the verified staged artifact"
            fetch "signed manifest snapshot" "${website_origin}/signatures/datapulse.json" "$smoke_dir/signatures/datapulse.json"
            cmp -s "$staged_manifest" "$smoke_dir/signatures/datapulse.json" || \
              fail "served signed manifest snapshot differs from the verified staged artifact"
            python3 scripts/verify_sigstore_bundle.py \
              --health _site/health/latest.json \
              --manifest "$smoke_dir/signatures/datapulse.json" \
              --legacy-chain-head "$RUNNER_TEMP/sigstore-publication/chain_head.json" \
              --source-commit "$GITHUB_SHA" \
              --bundle "$smoke_dir/health.latest.sigstore.json" \
              --certificate-identity "https://github.com/r3dz4r/datapulse-my/.github/workflows/deploy-cloudflare-pages.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --cosign "$(command -v cosign)" || fail "served Sigstore bundle verification failed"
          else
            sigstore_status="$(curl --location --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output "$smoke_dir/unsigned-sigstore-response" --write-out '%{http_code}' \
              "${website_origin}/${sigstore_path}")" || fail "could not prove optional Sigstore bundle absence"
            # The Cloudflare Pages SPA fallback serves the dashboard HTML with HTTP
            # 200 for ANY missing path, so a missing optional bundle is NOT provable
            # by a 404 alone. Absence is valid only when the response is NOT a real
            # Sigstore bundle: HTTP 404, or an HTML SPA fallback (dashboard shell).
            # A genuinely-served stale bundle (Sigstore JSON media type) is a hard
            # failure even on HTTP 200.
            if [[ "$sigstore_status" == "200" ]]; then
              if grep -q 'application/vnd.dev.sigstore.bundle' "$smoke_dir/unsigned-sigstore-response" \
                || grep -Eq '<html[ >]|<head>|id="main-content"|hero-heading' "$smoke_dir/unsigned-sigstore-response"; then
                :  # SPA fallback (dashboard HTML) — no real bundle served
              else
                fail "stale Sigstore bundle is still served after signing became unavailable (HTTP $sigstore_status)"
              fi
            elif [[ "$sigstore_status" != "404" ]]; then
              fail "unexpected HTTP status while proving optional Sigstore bundle absence (HTTP $sigstore_status)"
            fi
            echo '::warning title=Sigstore health bundle absent::Canonical health is current; the optional signer was unavailable and no bundle was published.'
          fi
          allow_legacy_release_proof="${{ needs.classify.outputs.health_only == 'true' && '1' || '0' }}"
          if [[ "$allow_legacy_release_proof" == "1" ]]; then
            staged_proof="$RUNNER_TEMP/preserved-release-proof/release-verification.md"
          else
            staged_proof="docs/release-verification.md"
          fi
          test -s "$staged_proof" || fail "staged release proof is missing"
          fetch "release reproducibility proof" "${website_origin}/release-verification.md" "$smoke_dir/release-verification.md"
          cmp -s "$staged_proof" "$smoke_dir/release-verification.md" || \
            fail "served release proof differs from staged artifact"
          python3 - "$smoke_dir/release-verification.md" "$(git rev-parse HEAD)" "$smoke_dir/health/latest.json" mcp.json "$allow_legacy_release_proof" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          proof_path, source_sha, health_path, mcp_path, allow_legacy = sys.argv[1:]
          contents = Path(proof_path).read_text(encoding="utf-8")
          if allow_legacy == "1":
              required = {
                  "release-proof title": r"^# Release reproducibility verification$",
                  "verification timestamp": r"^- (?:Generated|Verified) at: `[^`\\n]+`$",
                  "Source SHA": r"^- Source SHA: `[0-9a-f]{7,64}`$",
                  "Profile result": r"^- Profile result: .+$",
                  "Total files built": r"^- Total files built: .+$",
                  "hash table": r"^\\| Path category \\| File count \\| First-run hash \\| Second-run hash \\| Match\\? \\|$",
                  "hash table category row": r"^\\| (?![-: ]+\\|)[^|]+ \\| \\d+ \\|",
                  "Reproduction section": r"^## Reproduction$",
              }
              missing = [label for label, pattern in required.items() if re.search(pattern, contents, re.MULTILINE) is None]
          else:
              health = json.loads(Path(health_path).read_text(encoding="utf-8"))
              tools = json.loads(Path(mcp_path).read_text(encoding="utf-8"))["tools"]
              required = (
                  "<!-- generated: scripts/verify_release_reproducible.py; do not hand-edit -->",
                  "- Status: `current generated release proof`",
                  f"- Source SHA: `{source_sha}`",
                  f"- Health checked at: `{health['checked_at']}`",
                  f"- Dataset count: `{len(health['datasets'])}`",
                  f"- MCP tool count: `{len(tools)}`",
                  "- Protocol result: `byte-identical isolated release-build runs`",
              )
              missing = [line for line in required if line not in contents]
          if missing:
              raise SystemExit("release proof drift: " + "; ".join(missing))
          PY
          mapfile -t pages < <(jq -er '.pages[]' config/public-surfaces.json)
          mapfile -t artifacts < <(jq -er '.artifacts[]' config/public-surfaces.json)
          for path in "${pages[@]}" "${artifacts[@]}"; do
            [[ "$path" == "/" || "$path" =~ ^/[A-Za-z0-9._/-]+$ ]] || fail "unsafe declared public path: $path"
            if [[ "$path" == */ ]]; then
              declared_file="$(find "_site${path}" -type f -print -quit)" || fail "declared collection is missing: $path"
              [[ -n "$declared_file" ]] || fail "declared collection is empty: $path"
              path="/${declared_file#_site/}"
            fi
            fetch "declared public surface $path" "${website_origin}${path}" "$smoke_dir/surfaces${path%/}/index"
          done
          python3 - "$smoke_dir/index.html" "$smoke_dir/health/latest.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          dashboard = Path(sys.argv[1]).read_text(encoding="utf-8")
          health = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          match = re.search(r"window\.__DATAPULSE_DATA__\s*=\s*\{health:\s*", dashboard)
          if match is None:
              raise SystemExit("dashboard has no embedded health payload")
          decoder = json.JSONDecoder()
          embedded_health, _ = decoder.raw_decode(dashboard[match.end():])
          if embedded_health["checked_at"] != health["checked_at"]:
              raise SystemExit("embedded dashboard checked_at differs from served health/latest.json")
          if len(embedded_health["datasets"]) != len(health["datasets"]):
              raise SystemExit("embedded dashboard dataset count differs from served health/latest.json")
          if dashboard.count('"health_report":') != len(health["datasets"]):
              raise SystemExit("dashboard dataset-card count differs from served health/latest.json")
          PY
          expected_dataset_count="$(jq -er '.datasets | select(type == "array" and length > 0) | length' "$smoke_dir/health/latest.json")" || fail "served health has no dataset array"
          fetch "trend snapshot" "${website_origin}/health/trends.json" "$smoke_dir/trends.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-trends"
            and (.datasets | type == "array" and length == $expected)
            and (.summary.datasets_total == $expected)
          ' "$smoke_dir/trends.json" >/dev/null || fail "served trends are invalid"
          fetch "drift snapshot" "${website_origin}/health/drift.json" "$smoke_dir/drift.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-drift"
            and (.datasets | type == "array" and length == $expected)
            and (.summary.datasets_total == $expected)
          ' "$smoke_dir/drift.json" >/dev/null || fail "served drift is invalid"
          fetch "reconciliation snapshot" "${website_origin}/health/reconciliation.json" "$smoke_dir/reconciliation.json"
          jq -e --argjson expected "$expected_dataset_count" '
            .schema == "datapulse/v1/dataset-reconciliation"
            and (.summary.datasets_total == $expected)
            and (.summary.datasets_grouped + .summary.datasets_single_source == $expected)
          ' "$smoke_dir/reconciliation.json" >/dev/null || fail "served reconciliation is invalid"
          fetch "MCP inventory" "${website_origin}/mcp.json" "$smoke_dir/mcp.json"
          jq -e '
            .tools | type == "array" and length > 0 and
            all(.[]; type == "object" and
              (.name | type == "string" and length > 0) and
              (.inputSchema | type == "object"))
          ' "$smoke_dir/mcp.json" >/dev/null || fail "served MCP inventory is invalid"
          fetch "LLM index" "${website_origin}/llms.txt" "$smoke_dir/llms.txt"
          grep -Fxq '<!-- BEGIN mcp-tools -->' "$smoke_dir/llms.txt" || fail "served llms index has no MCP tools block"
          grep -Fxq '<!-- END mcp-tools -->' "$smoke_dir/llms.txt" || fail "served llms index has incomplete MCP tools block"
