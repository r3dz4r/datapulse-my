name: Deploy canonical dashboard to Cloudflare Pages

on:
  workflow_run:
    workflows: [Build canonical Pages publication]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      chain_depth:
        description: Successor depth (0 for a new publication chain)
        type: string
        required: true
        default: '0'
permissions:
  contents: read

env:
  PROMOTION_SETTLED_QUIET_SECONDS: 300
  PROMOTION_SETTLED_MAX_WAIT_SECONDS: 900
  # At most three successors per root run; malformed/exhausted depths stop.
  PUBLICATION_CHAIN_MAX_DEPTH: 3

concurrency:
  # Keep deploy candidates separate from the never-evict daily append producer.
  # A newer candidate replaces the pending deploy; the active run finishes.
  group: cloudflare-pages-deploy
  cancel-in-progress: false
  queue: single

jobs:
  classify:
    name: Classify native Pages input
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    # Initial settlement owns its budget before the signer starts.
    timeout-minutes: 20
    outputs:
      health_only: ${{ steps.classify.outputs.health_only }}
      settled_sha: ${{ steps.settled_main.outputs.settled_sha }}
      settlement_reason: ${{ steps.settled_main.outputs.settlement_reason }}
      build_run_id: ${{ steps.build.outputs.run_id }}
      build_attempt: ${{ steps.build.outputs.attempt }}
    steps:
      # Resolve inside the lock. A late old completion must consume the newest
      # successful main build, never the workflow_run event's older head.
      - name: Select newest successful main build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          builds="$(timeout -k 5s 60s gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/publish-publication.yml/runs" \
            -f branch=main -f status=success -f per_page=100)"
          selected="$(jq -ec --arg repo "$GITHUB_REPOSITORY" \
            '[.workflow_runs[] | select(.head_repository.full_name == $repo and .head_branch == "main" and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | max_by(.run_number) // error("No verified main build")' <<< "$builds")"
          sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$selected")"
          run_id="$(jq -er '.id' <<< "$selected")"
          attempt="$(jq -er '.run_attempt' <<< "$selected")"
          echo "PROMOTION_BUILT_SHA=$sha" >> "$GITHUB_ENV"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Wait for settled main before promoting
        id: settled_main
        env:
          GH_TOKEN: ${{ github.token }}
        run: &settle_main_run |
          set -Eeuo pipefail
          timeout -k 5s "$((PROMOTION_SETTLED_MAX_WAIT_SECONDS + 5))s" python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          import re
          import subprocess
          import time

          quiet = int(os.environ["PROMOTION_SETTLED_QUIET_SECONDS"])
          ceiling = int(os.environ["PROMOTION_SETTLED_MAX_WAIT_SECONDS"])
          if not 0 < quiet < ceiling:
              raise SystemExit("Settlement requires 0 < quiet period < hard ceiling")
          started = time.monotonic()
          deadline = started + ceiling
          previous_sha = None
          quiet_since = started
          confirmed = False
          while True:
              # Both the complete poll and each head read have a kill deadline.
              call_budget = min(30, deadline - time.monotonic())
              if call_budget <= 0:
                  reason = "ceiling"
                  break
              response = subprocess.run(
                  ["timeout", "-k", "5s", f"{call_budget}s", "gh", "api",
                   f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ.get('PROMOTION_BUILT_SHA', 'refs/heads/main')}",
                   "--header", "Cache-Control: no-cache"],
                  # Let GNU timeout kill its child group before the Python
                  # fallback kills the timeout supervisor itself.
                  check=True, capture_output=True, text=True, timeout=call_budget + 6,
              )
              head = json.loads(response.stdout)
              sha = head["sha"]
              if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  raise SystemExit("Main head lookup returned an invalid SHA")
              if os.environ.get("PROMOTION_BUILT_SHA", sha) != sha:
                  raise SystemExit("Build identity differs from settlement lookup")
              commit = head["commit"]
              committed_at = datetime.fromisoformat(commit["committer"]["date"].replace("Z", "+00:00"))
              age = (datetime.now(timezone.utc) - committed_at).total_seconds()
              now = time.monotonic()
              if sha != previous_sha:
                  # An old/backdated commit observed landing during this wait
                  # still restarts quiet; the timestamp alone is insufficient.
                  quiet_since = now - max(0, age) if previous_sha is None else now
                  previous_sha = sha
                  confirmed = False
                  print(f"Observed main {sha}; commit age {age:.0f}s", flush=True)
              if now >= deadline:
                  reason = "ceiling"
                  break
              if age >= quiet and now - quiet_since >= quiet:
                  if confirmed:
                      reason = "quiet"
                      break
                  # Re-read main immediately before declaring it settled.
                  confirmed = True
                  continue
              # Reserve a final bounded head read, then reach the ceiling
              # without starting a call with a vanishing timeout budget.
              remaining = deadline - now
              if remaining <= 1:
                  time.sleep(max(0, remaining))
                  reason = "ceiling"
                  break
              time.sleep(min(15, remaining - 1))
          if previous_sha is None:
              raise SystemExit("No identified main revision; refusing promotion")
          sha = previous_sha
          if reason == "ceiling":
              print(f"::warning title=Main settlement ceiling reached::Proceeding with newest observed main {sha} after {ceiling}s without quiet", flush=True)
          else:
              print(f"Main settled by quiet: {sha} ({quiet}s quiet)", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"settled_sha={sha}\nsettlement_reason={reason}\n")
          PY

      - name: Log promotion source resolution
        env:
          SETTLED_SHA: ${{ steps.settled_main.outputs.settled_sha }}
          SETTLEMENT_REASON: ${{ steps.settled_main.outputs.settlement_reason }}
        run: |
          set -Eeuo pipefail
          printf 'settled_sha=%s\n' "${SETTLED_SHA:-<empty>}"
          printf 'settlement_reason=%s\n' "${SETTLEMENT_REASON:-<empty>}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.settled_main.outputs.settled_sha }}
          fetch-depth: 0
          sparse-checkout: |
            scripts/classify_change.py
            scripts/verify_release_artifact.py
          sparse-checkout-cone-mode: false
      - name: Require available verified build before signing
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-build-${{ steps.build.outputs.run_id }}-${{ steps.build.outputs.attempt }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      - name: Extract build handoff before signing
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/pages-build"
          tar -xf "$RUNNER_TEMP/pages-build.tar" -C "$RUNNER_TEMP/pages-build"

      - name: Verify build handoff before signing
        env:
          SELECTED_SHA: ${{ steps.settled_main.outputs.settled_sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py verify \
            --site "$RUNNER_TEMP/pages-build/workspace" \
            --manifest "$RUNNER_TEMP/pages-build/manifest.json" \
            --source-commit "$SELECTED_SHA"

      - name: Refuse production regression and identify classification base
        id: production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SELECTED_SHA: ${{ steps.settled_main.outputs.settled_sha }}
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/datapulse-p4b-preview")"
          deployed="$(jq -er 'select(.success == true) | .result.canonical_deployment.deployment_trigger.metadata.commit_hash | select(test("^[0-9a-f]{40}$"))' <<< "$response")"
          timeout -k 5s 60s git fetch origin "$deployed"
          # Also covers an earlier run that published but failed served checks.
          timeout -k 5s 10s git merge-base --is-ancestor "$deployed" "$SELECTED_SHA"
          echo "source_sha=$deployed" >> "$GITHUB_OUTPUT"

      - id: classify
        env:
          BEFORE_SHA: ${{ steps.production.outputs.source_sha }}
          AFTER_SHA: ${{ steps.settled_main.outputs.settled_sha }}
        run: |
          set -Eeuo pipefail
          echo "health_only=false" >> "$GITHUB_OUTPUT"
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || exit 0
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | python3 scripts/classify_change.py; then
            echo "health_only=true" >> "$GITHUB_OUTPUT"
          fi

  sign_health:
    needs: classify
    name: Sign current health with public Sigstore
    runs-on: ubuntu-latest
    environment: production
    # Preserve the existing ceiling for settlement, full evidence verification and signing.
    timeout-minutes: 142
    permissions:
      contents: read
      id-token: write
    env:
      PROMOTION_SOURCE_SHA: ${{ needs.classify.outputs.settled_sha }}
      PROMOTION_BUILT_SHA: ${{ needs.classify.outputs.settled_sha }}
    outputs:
      settled_sha: ${{ steps.settled_main.outputs.settled_sha }}
      health_only: ${{ steps.settled_main.outputs.health_only }}
      attestation_state: ${{ steps.attestation_result.outputs.state }}
      signed: ${{ steps.sigstore_result.outputs.signed }}
      receipts_signed: ${{ steps.per_receipt_result.outputs.signed }}
      accepted_head_state: ${{ steps.accepted_head.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.settled_sha }}
          fetch-depth: 0
          filter: blob:none
          # Signing only reads accepted Git evidence; do not persist credentials.
          persist-credentials: false

      - name: Require settled main before signing
        id: settled_main
        # Fits both 900s waits plus bounded head reads and checkout verification.
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          # Alias the classify gate's exact wait, including its quiet/ceiling logs.
          PROMOTION_SETTLE_RUN: *settle_main_run
          PROMOTION_HEALTH_ONLY: ${{ needs.classify.outputs.health_only }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$PROMOTION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Unidentified promotion revision::Selected SHA is empty or malformed; refusing signing.' >&2
            exit 1
          fi
          initial_sha="$PROMOTION_SOURCE_SHA"
          attempts=0
          max_attempts=2
          while :; do
            if ! current_sha="$(timeout -k 5s 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --header 'Cache-Control: no-cache' --jq '.object.sha')" \
              || [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error title=Unidentified main revision::Main lookup failed or returned an empty/malformed SHA; refusing signing.' >&2
              exit 1
            fi
            if [[ -n "${PROMOTION_BUILT_SHA:-}" ]]; then
              timeout -k 5s 60s git fetch origin "$current_sha"
              timeout -k 5s 10s git merge-base --is-ancestor "$PROMOTION_BUILT_SHA" "$current_sha"
              current_sha="$PROMOTION_BUILT_SHA"
            fi
            [[ "$current_sha" != "$PROMOTION_SOURCE_SHA" ]] || break
            if [[ "$attempts" -ge "$max_attempts" ]]; then
              echo "::error title=Main re-settlement exhausted::Re-settle attempts exhausted after $attempts attempts; selected $PROMOTION_SOURCE_SHA, current main $current_sha; refusing signing." >&2
              exit 1
            fi
            attempts=$((attempts + 1))
            echo "main moved; re-settling $PROMOTION_SOURCE_SHA -> $current_sha (attempt $attempts/$max_attempts)"
            settlement_output="$(mktemp "$RUNNER_TEMP/resettled-main.XXXXXX")"
            if ! GITHUB_OUTPUT="$settlement_output" bash -Eeuo pipefail -c "$PROMOTION_SETTLE_RUN"; then
              echo "::error title=Main re-settlement failed::Unable to identify a settled revision on attempt $attempts/$max_attempts; refusing signing." >&2
              exit 1
            fi
            settled_sha=''
            settlement_reason=''
            while IFS='=' read -r key value; do
              case "$key" in
                settled_sha) settled_sha="$value" ;;
                settlement_reason) settlement_reason="$value" ;;
              esac
            done < "$settlement_output"
            if [[ ! "$settled_sha" =~ ^[0-9a-f]{40}$ ]] \
              || [[ "$settlement_reason" != quiet && "$settlement_reason" != ceiling ]]; then
              echo "::error title=Unidentified re-settled revision::Invalid settlement output on attempt $attempts/$max_attempts; refusing signing." >&2
              exit 1
            fi
            # The gate may select at its ceiling; recovery must actually reach
            # quiet before replacing an already selected signing revision.
            if [[ "$settlement_reason" == ceiling ]]; then
              echo "::warning title=Main re-settlement still busy::Attempt $attempts/$max_attempts reached the ceiling at $settled_sha without quiet."
              if [[ "$attempts" -ge "$max_attempts" ]]; then
                echo "::error title=Main re-settlement exhausted::Re-settle attempts exhausted after $attempts attempts without quiet; refusing signing." >&2
                exit 1
              fi
              continue
            fi
            if ! timeout -k 5s 60s git fetch origin "$settled_sha" \
              || ! timeout -k 5s 10s git cat-file -e "${settled_sha}^{commit}" \
              || ! timeout -k 5s 10s git merge-base --is-ancestor "$PROMOTION_SOURCE_SHA" "$settled_sha"; then
              echo "::error title=Unverified main revision::Cannot verify $settled_sha as an advance from $PROMOTION_SOURCE_SHA on attempt $attempts/$max_attempts; refusing signing." >&2
              exit 1
            fi
            # Restore accepted evidence before changing the source checkout.
            timeout -k 5s 140s bash scripts/restore_attestations.sh --source HEAD
            timeout -k 5s 30s git checkout --detach "$settled_sha"
            [[ "$(timeout -k 5s 10s git rev-parse HEAD)" == "$settled_sha" ]]
            echo "Re-settled promotion revision: $PROMOTION_SOURCE_SHA -> $settled_sha ($settlement_reason)"
            export PROMOTION_SOURCE_SHA="$settled_sha"
          done
          # A newer source change must not inherit an older health-only bypass.
          if [[ "$PROMOTION_HEALTH_ONLY" == true && "$initial_sha" != "$PROMOTION_SOURCE_SHA" ]]; then
            if ! timeout -k 5s 30s git diff --name-only "$initial_sha" "$PROMOTION_SOURCE_SHA" \
              | timeout -k 5s 30s python3 scripts/classify_change.py; then
              PROMOTION_HEALTH_ONLY=false
            fi
          fi
          echo "Signing identified promotion revision $PROMOTION_SOURCE_SHA after $attempts re-settle attempts."
          echo "PROMOTION_SOURCE_SHA=$PROMOTION_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "settled_sha=$PROMOTION_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "health_only=$PROMOTION_HEALTH_ONLY" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify main's accepted chain head
        id: accepted_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Pin one fetched main tree; neither an open PR nor local HEAD is authority.
          timeout -k 5s 30s git fetch origin refs/heads/main:refs/remotes/origin/main
          accepted_main="$(timeout -k 5s 10s git rev-parse refs/remotes/origin/main)"
          timeout -k 5s 10s git merge-base --is-ancestor "$PROMOTION_SOURCE_SHA" "$accepted_main"
          timeout -k 5s 140s bash scripts/restore_attestations.sh --source "$accepted_main"
          python3 - "$accepted_main" <<'PYTHON'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          from scripts import gen_attestations as ga
          from scripts.attestation_sets import set_directory
          from scripts.verify_attestation_append import accepted_discovery, git_bytes, verify_append
          from scripts.verify_attestation_binding import ContractError, verify_contract

          root = Path.cwd()
          revision = sys.argv[1]
          accepted = accepted_discovery(root, revision)
          index = json.loads(git_bytes(root, revision, "attestations/chain-index.json"))
          head = index.get("current_head")
          if not head or head != accepted["current_head"] or head not in index["heads"]:
              raise ContractError("main chain index does not name the accepted current head")
          if index["heads"][head] != accepted["heads"][head]:
              raise ContractError("main chain index disagrees with accepted head reference")
          verify_append(root, revision, require_committed=True)
          mirror = json.loads((root / ".attestations/chain_head.json").read_bytes())
          if mirror.get("chain_head") != head:
              raise ContractError("signing head is not main's accepted head")
          directory = set_directory(accepted["heads"][head])
          immutable_revision = root / directory / "revisions" / head
          if (immutable_revision / "chain_head.json").is_file():
              directory = immutable_revision.relative_to(root).as_posix()
          manifest, health, _, _, _ = ga.load_score_inputs(root)
          registry = ga.load(root / "docs/.well-known/datapulse-probe-keys.json")
          if not ga.agrees(root, directory, manifest, ga.health_binding(root, health), registry, None):
              raise ContractError("accepted envelope does not match current inputs")
          # Exact health bytes, Ed25519 signatures and the accepted Rekor binding are
          # mandatory. A newer health snapshot must fail, never mint a private append.
          verify_contract(root, require_rekor=True, allow_newer_health=False)
          PYTHON
          echo "state=accepted" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic health attestation statement
        if: steps.accepted_head.outputs.state == 'accepted'
        run: |
          set -Eeuo pipefail
          python3 scripts/gen_sigstore_bundle.py \
            --health health/latest.json \
            --manifest datapulse.json \
            --legacy-chain-head .attestations/chain_head.json \
            --source-commit "$PROMOTION_SOURCE_SHA" \
            --out "$RUNNER_TEMP/health.latest.statement.json"

      - name: Attempt pinned Cosign signer installation for health-only degradation
        if: steps.accepted_head.outputs.state == 'accepted'
        id: install_cosign
        # A signer installation outage is represented explicitly below as
        # signer_down. Invalid signer output and verification failures remain fatal.
        continue-on-error: true
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Sign and verify current health DSSE bundle
        id: sign_current_health
        if: steps.install_cosign.outcome == 'success' && steps.accepted_head.outputs.state == 'accepted'
        env:
          SIGSTORE_IDENTITY: https://github.com/r3dz4r/datapulse-my/.github/workflows/deploy-cloudflare-pages.yml@refs/heads/main
          SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          publication="$RUNNER_TEMP/sigstore-publication"
          mkdir -p "$publication"
          bundle_tmp="$publication/.health.latest.sigstore.json.tmp"
          if ! cosign attest-blob \
            --yes \
            --statement "$RUNNER_TEMP/health.latest.statement.json" \
            --bundle "$bundle_tmp" \
            health/latest.json; then
            echo "state=signer_down" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/verify_sigstore_bundle.py \
            --health health/latest.json \
            --manifest datapulse.json \
            --legacy-chain-head .attestations/chain_head.json \
            --source-commit "$PROMOTION_SOURCE_SHA" \
            --bundle "$bundle_tmp" \
            --certificate-identity "$SIGSTORE_IDENTITY" \
            --certificate-oidc-issuer "$SIGSTORE_ISSUER" \
            --cosign "$(command -v cosign)"
          mv "$bundle_tmp" "$publication/health.latest.sigstore.json"
          # Publish the exact sign-time inputs beside the bundle. The manifest
          # snapshot is the canonical verification input; release-build may
          # later regenerate the top-level discovery manifest.
          cp .attestations/chain_head.json "$publication/chain_head.json"
          cp datapulse.json "$publication/datapulse.json"
          test -s attestations/latest/chain_head.json
          test -s attestations/latest/index.json
          test -s attestations/latest/scores.json
          test -s attestations/latest/binding.json
          test -s .attestations/chain_head.json
          test -s "$publication/datapulse.json"
          cp -R attestations "$publication/attestations"
          cp -R .attestations "$publication/.attestations"
          echo "state=signed" >> "$GITHUB_OUTPUT"

      - name: Stage statement into Sigstore publication
        if: steps.sign_current_health.outputs.state == 'signed' && steps.accepted_head.outputs.state == 'accepted'
        run: cp "$RUNNER_TEMP/health.latest.statement.json" "$RUNNER_TEMP/sigstore-publication/"

      - name: Generate per-dataset evidence statements
        if: steps.accepted_head.outputs.state == 'accepted'
        run: python3 scripts/gen_per_dataset_receipt.py

      - name: Sign per-dataset evidence statements
        id: sign_per_dataset
        if: steps.sign_current_health.outputs.state == 'signed' && steps.accepted_head.outputs.state == 'accepted'
        env:
          SIGSTORE_IDENTITY: https://github.com/r3dz4r/datapulse-my/.github/workflows/deploy-cloudflare-pages.yml@refs/heads/main
          SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          python3 scripts/sign_per_dataset_receipts.py \
            --cosign "$(command -v cosign)" \
            --result-out "$RUNNER_TEMP/per-dataset-receipts.result"
          if [[ "$(cat "$RUNNER_TEMP/per-dataset-receipts.result")" == "signed" ]]; then
            python3 scripts/verify_per_dataset_receipt.py \
              --certificate-identity "$SIGSTORE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_ISSUER" \
              --cosign "$(command -v cosign)"
            publication="$RUNNER_TEMP/sigstore-publication"
            mkdir -p "$publication/data"
            cp data/*.receipt.evidence.json data/*.receipt.statement.json data/*.receipt.sigstore.json "$publication/data/"
          fi

      - name: Record per-dataset receipt result
        id: per_receipt_result
        if: always() && steps.accepted_head.outputs.state == 'accepted'
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.sign_current_health.outputs.state }}" == "signed" \
             && "${{ steps.sign_per_dataset.outcome }}" == "success" \
             && -f "$RUNNER_TEMP/per-dataset-receipts.result" \
             && "$(cat "$RUNNER_TEMP/per-dataset-receipts.result")" == "signed" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/sigstore-publication/data"
            echo '::warning title=Sigstore per-dataset signing unavailable::Canonical health will be published without per-dataset bundles.'
          fi

      - name: Upload verified Sigstore bundle
        id: upload_sigstore
        if: steps.sign_current_health.outputs.state == 'signed' && steps.accepted_head.outputs.state == 'accepted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigstore-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sigstore-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Record explicit attestation state
        id: attestation_result
        if: always() && steps.accepted_head.outputs.state == 'accepted'
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.install_cosign.outcome }}" != "success" ]]; then
            echo "state=signer_down" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.sign_current_health.outputs.state }}" == "signer_down" ]]; then
            echo "state=signer_down" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.sign_current_health.outputs.state }}" == "signed" \
             && "${{ steps.upload_sigstore.outcome }}" == "success" ]]; then
            echo "state=signed" >> "$GITHUB_OUTPUT"
          else
            echo '::error title=Sigstore attestation invalid::Signer output, verification, or publication was incomplete.'
            exit 1
          fi

      - name: Record Sigstore result
        id: sigstore_result
        if: always() && steps.accepted_head.outputs.state == 'accepted'
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.attestation_result.outputs.state }}" == "signed" \
             && -s "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json"
            rm -f "$RUNNER_TEMP/health.latest.statement.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/chain_head.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/datapulse.json"
            rm -f "$RUNNER_TEMP/sigstore-publication/.health.latest.sigstore.json.tmp"
            echo '::warning title=Signer lane down::Health-only publication may preserve the last verified attestation plane; full releases are blocked.'
          fi

  deploy:
    # All publication requires a verified accepted head, including health-only.
    if: needs.sign_health.outputs.accepted_head_state == 'accepted'
    permissions:
      contents: read
      actions: read
    needs: [classify, sign_health]
    runs-on: ubuntu-latest
    environment: production
    # Starts after sign_health succeeds; deployment has its own 30m budget.
    timeout-minutes: 30
    env:
      PROMOTION_SOURCE_SHA: ${{ needs.sign_health.outputs.settled_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sign_health.outputs.settled_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Download verified per-commit release build
        if: needs.sign_health.outputs.health_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-build-${{ needs.classify.outputs.build_run_id }}-${{ needs.classify.outputs.build_attempt }}
          run-id: ${{ needs.classify.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      - name: Extract verified per-commit release build
        if: needs.sign_health.outputs.health_only != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/pages-build"
          tar -xf "$RUNNER_TEMP/pages-build.tar" -C "$RUNNER_TEMP/pages-build"

      - name: Verify per-commit build identity and bytes
        if: needs.sign_health.outputs.health_only != 'true'
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py verify \
            --site "$RUNNER_TEMP/pages-build/workspace" \
            --manifest "$RUNNER_TEMP/pages-build/manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"
          echo "VERIFIED_PAGES_BUILD=$RUNNER_TEMP/pages-build/workspace" >> "$GITHUB_ENV"

      - name: Validate canonical health snapshot
        run: |
          set -Eeuo pipefail
          jq -e '
            .checked_at | type == "string" and length > 0
          ' health/latest.json >/dev/null
          jq -e '
            .datasets | type == "array" and length > 0
          ' health/latest.json >/dev/null

      - name: Require signed attestation for full release
        if: needs.sign_health.outputs.health_only != 'true' && needs.sign_health.outputs.attestation_state != 'signed'
        run: |
          echo '::error title=Cloudflare attestation contract failed::Full releases require attestation_state=signed; signer_down is permitted only for classifier-scoped health-only publication.'
          exit 1

      - name: Embed canonical health dashboard (health-only path)
        if: needs.sign_health.outputs.health_only == 'true'
        run: python3 scripts/embed_dashboard_data.py --health health/latest.json

      - name: Install Pandoc
        if: needs.sign_health.outputs.health_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install release verification dependencies
        if: needs.sign_health.outputs.health_only != 'true'
        run: python -m pip install jsonschema --requirement mcp/requirements.txt 'datacontract-cli[duckdb]==0.12.5'

      - name: Run release-build generation profile (non-health path)
        if: needs.sign_health.outputs.health_only != 'true'
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIED_PAGES_BUILD:-}" ]]; then
            # Replace directory inventories, including files removed by the
            # generators; overlay-copying would retain obsolete served pages.
            rm -rf docs health deltas record-evidence badges samples data
            cp -R "$VERIFIED_PAGES_BUILD/." .
            exit 0
          fi
          export DATAPULSE_SOURCE_COMMIT_SHA="$PROMOTION_SOURCE_SHA"
          export DATAPULSE_SOURCE_COMMIT_DATE="$(git show -s --format=%cs "$PROMOTION_SOURCE_SHA")"
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          bash scripts/generate.sh release-build

      - name: Generate per-dataset evidence statements (release artifact)
        if: needs.sign_health.outputs.health_only != 'true'
        run: python3 scripts/gen_per_dataset_receipt.py

      - name: Validate DataPulse contract (non-health path)
        if: needs.sign_health.outputs.health_only != 'true'
        run: bash scripts/run_datacontract_validation.sh

      - name: Verify full release contract (non-health path)
        if: needs.sign_health.outputs.health_only != 'true'
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          if [[ -n "${VERIFIED_PAGES_BUILD:-}" ]]; then
            python3 scripts/verify_release_artifact.py verify \
              --site "$VERIFIED_PAGES_BUILD" \
              --manifest "$RUNNER_TEMP/pages-build/manifest.json" \
              --source-commit "$PROMOTION_SOURCE_SHA"
            python3 scripts/verify_release_reproducible.py --verify-proof docs/release-verification.md
            exit 0
          fi
          python3 scripts/verify_release_reproducible.py \
            --workdir-root "$RUNNER_TEMP" \
            --output docs/release-verification.md
          python3 scripts/verify_release_reproducible.py \
            --verify-proof docs/release-verification.md
          bash scripts/verify_release_invariants.sh --local

      - name: Preserve served release proof (health-only path)
        if: needs.sign_health.outputs.health_only == 'true'
        run: |
          set -Eeuo pipefail
          fail() { echo "::error title=Cloudflare release-proof preservation failed::$1"; exit 1; }
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)" || fail "invalid website origin"
          preserved_proof="$RUNNER_TEMP/preserved-release-proof/release-verification.md"
          rm -rf "$(dirname "$preserved_proof")"
          mkdir -p "$(dirname "$preserved_proof")"
          curl --fail --location --silent --show-error --proto '=https' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${website_origin}/release-verification.md" --output "$preserved_proof" || \
            fail "served release proof could not be fetched"
          test -s "$preserved_proof" || fail "served release proof is empty"
          python3 - "$preserved_proof" <<'PY' || fail "served release proof has an invalid legacy format"
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys

          proof = Path(sys.argv[1]).read_text(encoding="utf-8")
          required = {
              "release-proof title": r"^# Release reproducibility verification$",
              "verification timestamp": r"^- (?:Generated|Verified) at: `[^`\\n]+`$",
              "Source SHA": r"^- Source SHA: `[0-9a-f]{7,64}`$",
              "Profile result": r"^- Profile result: .+$",
              "Total files built": r"^- Total files built: .+$",
              "hash table": r"^\\| Path category \\| File count \\| First-run hash \\| Second-run hash \\| Match\\? \\|$",
              "hash table category row": r"^\\| (?![-: ]+\\|)[^|]+ \\| \\d+ \\|",
              "Reproduction section": r"^## Reproduction$",
          }
          missing = [label for label, pattern in required.items() if re.search(pattern, proof, re.MULTILINE) is None]
          if missing:
              raise SystemExit("legacy release proof format: missing " + "; ".join(missing))
          PY

      - name: Preserve served attestation plane (health-only path)
        if: needs.sign_health.outputs.health_only == 'true' && needs.sign_health.outputs.attestation_state == 'signer_down'
        run: |
          set -Eeuo pipefail
          # A health-only checkout can lag a completed release. Its attestation
          # files are not authoritative: preserve the currently served verified
          # plane, or stop before a Cloudflare artifact is uploaded.
          fail() { echo "::error title=Cloudflare attestation preservation failed::$1"; exit 1; }
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)" || fail "invalid website origin"
          preserved_root="$RUNNER_TEMP/preserved-attestations"
          rm -rf "$preserved_root"
          mkdir -p "$preserved_root/health" "$preserved_root/attestations/latest" "$preserved_root/docs/.well-known"
          fetch_public() {
            local path="$1" output="$2"
            [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unsafe served path: $path"
            mkdir -p "$(dirname "$output")"
            curl --fail --location --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "${website_origin}/${path}" --output "$output" || fail "served attestation file could not be fetched: $path"
          }
          # A lagging plane may carry no per-set health snapshot; treat its
          # absence as "not recorded", never as a reason to reject the plane.
          fetch_optional() {
            local path="$1" output="$2"
            [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unsafe served path: $path"
            mkdir -p "$(dirname "$output")"
            curl --fail --location --silent --show-error --proto '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "${website_origin}/${path}" --output "$output" 2>/dev/null || true
          }
          fetch_public health/latest.json "$preserved_root/health/latest.json"
          fetch_public .well-known/datapulse-probe-keys.json "$preserved_root/docs/.well-known/datapulse-probe-keys.json"
          fetch_public attestations/latest/index.json "$preserved_root/attestations/latest/index.json"
          fetch_public attestations/latest/chain_head.json "$preserved_root/attestations/latest/chain_head.json"
          fetch_public attestations/latest/scores.json "$preserved_root/attestations/latest/scores.json"
          fetch_public attestations/latest/binding.json "$preserved_root/attestations/latest/binding.json"
          fetch_public attestations/chain-index.json "$preserved_root/attestations/chain-index.json"
          fetch_public .attestations/chain_head.json "$preserved_root/.attestations/chain_head.json"
          python3 scripts/attestation_fetch_refs.py --root "$preserved_root" > "$RUNNER_TEMP/immutable-refs.txt"
          while IFS= read -r reference; do
            fetch_public "$reference" "$preserved_root/$reference"
          done < "$RUNNER_TEMP/immutable-refs.txt"
          python3 scripts/attestation_fetch_refs.py --root "$preserved_root" --proofs > "$RUNNER_TEMP/proof-refs.txt"
          while IFS= read -r reference; do
            fetch_public "$reference" "$preserved_root/$reference"
          done < "$RUNNER_TEMP/proof-refs.txt"
          # Full verification authenticates dataset membership in every fetched
          # immutable set, including earlier heads in the accepted lineage.
          while IFS= read -r metadata_ref; do
            [[ "$metadata_ref" == */index.json ]] || continue
            directory="${metadata_ref%/index.json}"
            # Main's correction evidence records the health input beside the
            # signed set; fetch it so the lineage verifier can check its digest.
            fetch_optional "$directory/health.json" "$preserved_root/$directory/health.json"
            fetch_optional "$directory/health.json.gz" "$preserved_root/$directory/health.json.gz"
            # A correction also pins its new input in a content-addressed
            # snapshot named by its signed record; fetch that too so the full
            # lineage verification can authenticate the record.
            correction_snapshot="$(jq -r '.payload.correction.health_snapshot_ref // empty' "$preserved_root/$directory/binding.json")"
            if [[ -n "$correction_snapshot" ]]; then
              [[ "$correction_snapshot" =~ ^attestations/[0-9]{4}-[0-9]{2}-[0-9]{2}/revisions/[0-9a-f]{64}/health\.json(\.gz)?$ ]] || fail "unsafe correction snapshot reference: $correction_snapshot"
              fetch_public "$correction_snapshot" "$preserved_root/$correction_snapshot"
            fi
            while IFS= read -r reference; do
              [[ "$reference" == "$directory/"* && "$reference" =~ ^attestations/[0-9]{4}-[0-9]{2}-[0-9]{2}/(revisions/[0-9a-f]{64}/)?[A-Za-z0-9_-]+\.json$ ]] || fail "served attestation reference is unsafe: $reference"
              fetch_public "$reference" "$preserved_root/$reference"
            done < <(jq -r '.attestations | to_entries[] | .value' "$preserved_root/$metadata_ref")
          done < "$RUNNER_TEMP/immutable-refs.txt"
          if attestation_plane_state="$(python3 scripts/verify_attestation_plane_state.py --planedir "$preserved_root")"; then
            if [[ "$attestation_plane_state" == "signer_down" ]]; then
              echo '::warning title=Signer lane down (P6); attestation failed-closed::Served attestation plane is stale and explicitly reports artifact_signed:false; preserving it unchanged.'
            fi
          else
            if ! python3 scripts/verify_attestation_binding.py --root "$preserved_root"; then
              echo "Attestation cryptographic verification failed; refusing to preserve the served plane."
            fi
            fail "served health/binding plane is inconsistent; Run a full release-build deployment to heal the public trust plane."
          fi

      - name: Download verified optional Sigstore bundle
        if: needs.sign_health.outputs.signed == 'true' || needs.sign_health.outputs.receipts_signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sigstore-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sigstore-publication

      - name: Bind built dashboard to accepted sign-time trust plane
        if: needs.sign_health.outputs.health_only != 'true'
        run: |
          set -Eeuo pipefail
          publication="$RUNNER_TEMP/sigstore-publication"
          test -s "$publication/datapulse.json"
          test -s "$publication/attestations/latest/binding.json"
          # A build's private candidate may have an older predecessor. Rebind
          # only the dashboard projection to the one accepted by this signer;
          # never publish or append a per-build candidate to repair references.
          cp "$publication/datapulse.json" datapulse.json
          rm -rf attestations .attestations
          cp -R "$publication/attestations" "$publication/.attestations" .
          python3 scripts/embed_dashboard_data.py --health health/latest.json
          bash scripts/verify_release_invariants.sh --local

      - name: Assemble canonical Pages artifact
        run: |
          set -Eeuo pipefail
          rm -rf _site
          mkdir -p _site/.well-known
          cp -R docs/. _site/
          cp -R functions _site/
          if [[ -d "$RUNNER_TEMP/preserved-release-proof" ]]; then
            test -s "$RUNNER_TEMP/preserved-release-proof/release-verification.md"
            cp "$RUNNER_TEMP/preserved-release-proof/release-verification.md" _site/release-verification.md
          fi
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json datapulse_summary.json custodians.json datapulse.schema.json health.schema.json agent.schema.json mcp.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json _site/
          cp -R health deltas record-evidence badges samples data _site/
          if [ -d observation-receipts ]; then cp -R observation-receipts _site/; fi
          if [[ "${{ needs.sign_health.outputs.receipts_signed }}" == "true" ]]; then
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.evidence.json _site/data/
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.statement.json _site/data/
            cp "$RUNNER_TEMP/sigstore-publication/data/"*.receipt.sigstore.json _site/data/
          fi
          cp -R attestations _site/
          cp -R .attestations _site/
          cp docs/.well-known/datapulse-probe-keys.json _site/.well-known/
          if [[ -d "$RUNNER_TEMP/preserved-attestations" ]]; then
            # The new health bytes cannot inherit a served binding. Preserve the
            # verified historical plane and leave current trust claims fail-closed.
            rm -rf _site/attestations
            cp -R "$RUNNER_TEMP/preserved-attestations/attestations" _site/
            rm -f _site/attestations/latest/binding.json
            cp "$RUNNER_TEMP/preserved-attestations/docs/.well-known/datapulse-probe-keys.json" _site/.well-known/
          fi
          if [[ "${{ needs.sign_health.outputs.signed }}" == "true" ]]; then
            test -s "$RUNNER_TEMP/sigstore-publication/datapulse.json"
            test -s "$RUNNER_TEMP/sigstore-publication/attestations/latest/chain_head.json"
            rm -rf _site/attestations
            rm -rf _site/.attestations
            cp "$RUNNER_TEMP/sigstore-publication/datapulse.json" _site/datapulse.json
            cp -R "$RUNNER_TEMP/sigstore-publication/attestations" _site/
            cp -R "$RUNNER_TEMP/sigstore-publication/.attestations" _site/
          fi
          if [[ "${{ needs.sign_health.outputs.signed }}" == "true" ]]; then
            test -s "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json"
            test -s "$RUNNER_TEMP/sigstore-publication/health.latest.statement.json"
            test -s "$RUNNER_TEMP/sigstore-publication/chain_head.json"
            test -s "$RUNNER_TEMP/sigstore-publication/datapulse.json"
            mkdir -p _site/signatures
            cp "$RUNNER_TEMP/sigstore-publication/health.latest.sigstore.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/health.latest.statement.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/chain_head.json" _site/signatures/
            cp "$RUNNER_TEMP/sigstore-publication/datapulse.json" _site/signatures/
          fi
          test -s _site/index.html
          test -s _site/404.html
          test "$(grep -c '[^[:space:]]' _site/_redirects)" -ge 4
          grep -qxF '/methodology /health-methodology 301' _site/_redirects
          grep -qxF '/trust-contract /trust-contract.md 301' _site/_redirects
          grep -qxF '/okf/ /okf/index.md 301' _site/_redirects
          grep -qxF '/okf /okf/index.md 301' _site/_redirects
          test -s _site/health/latest.json

      - name: Keep verifier-reachable attestation history
        run: python3 scripts/select_served_attestations.py --apply --root . --site _site --full-revisions-per-day 1 --max-files 18000

      - name: Require served projections from committed main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          accepted_root="$RUNNER_TEMP/accepted-projections"
          git worktree add --detach --no-checkout "$accepted_root" origin/main
          committed_head="$(git -C "$accepted_root" show HEAD:attestations/chain-index.json | jq -er '.current_head')"
          materialize_projections() {
          # Discovery reads the signed spine from Git. Only the selected
          # projection source files need a filesystem checkout.
          projection_paths="$(python3 - "$accepted_root" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          from scripts.attestation_sets import FILES, set_directory
          from scripts.gen_attestation_projections import PROJECTIONS, REGISTRY
          from scripts.verify_attestation_append import accepted_discovery

          root = Path(sys.argv[1])
          document = accepted_discovery(root, "HEAD")
          head = document["current_head"]
          directory = set_directory(document["heads"][head])
          revision_head = f"{directory}/revisions/{head}/chain_head.json"
          listed = subprocess.check_output(
              ["git", "-C", str(root), "ls-tree", "--name-only", "HEAD", "--", revision_head],
              text=True,
          ).splitlines()
          if revision_head in listed:
              directory = set_directory(revision_head)
          paths = {*PROJECTIONS, REGISTRY, *(f"{directory}/{name}" for name in FILES)}
          print("\n".join("/" + path for path in sorted(paths)))
          PY
          )"
          git -C "$accepted_root" sparse-checkout set --no-cone --stdin <<< "$projection_paths"
          }
          materialize_projections
          git -C "$accepted_root" reset --hard HEAD >/dev/null
          if served_head="$(jq -er '.current_head | select(type == "string")' _site/attestations/chain-index.json)"; then
            :
          else
            served_head=invalid
          fi
          # The accepted writer checks the Git-selected chain without modifying it.
          if python3 scripts/gen_attestation_projections.py --root "$accepted_root" --check; then
            projection_status=0
          else
            projection_status=$?
          fi
          if [[ "$projection_status" == 1 ]]; then
            refresh_deadline=$((SECONDS + 600))
            # Every blocking call shares the wall-clock budget, without kill grace.
            refresh_call() {
              local remaining=$((refresh_deadline - SECONDS))
              (( remaining > 0 )) || return 124
              timeout --signal=KILL "${remaining}s" "$@"
            }
            echo "::notice title=Projections pending refresh::served_head=$served_head committed_head=$committed_head"
            export -f materialize_projections
            export accepted_root
            for ((attempt=0; attempt<30; attempt++)); do
              (( refresh_deadline - SECONDS >= 20 )) || break
              sleep 20
              (( SECONDS < refresh_deadline )) || break
              main_before="$(refresh_call git rev-parse origin/main)" || break
              refresh_call git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main || break
              main_after="$(refresh_call git rev-parse origin/main)" || break
              if [[ "$main_after" != "$main_before" ]]; then
                # Fetch moves the remote ref, not the detached worktree's HEAD.
                refresh_call git -C "$accepted_root" update-ref --no-deref HEAD "$main_after" || break
                refresh_call bash -Eeuo pipefail -c materialize_projections || break
                refresh_call git -C "$accepted_root" reset --hard HEAD >/dev/null || break
                committed_head="$(refresh_call git -C "$accepted_root" show HEAD:attestations/chain-index.json | refresh_call jq -er '.current_head')" || break
              fi
              if refresh_call python3 scripts/gen_attestation_projections.py --root "$accepted_root" --check; then
                projection_status=0
                break
              else
                projection_status=$?
              fi
              [[ "$projection_status" == 1 ]] || break
            done
            if [[ "$projection_status" != 0 ]]; then
              echo "::notice title=Projections pending refresh timed out::served_head=$served_head committed_head=$committed_head"
            fi
          fi
          if [[ "$projection_status" != 0 ]]; then
            echo "::error title=Attestation projection mismatch::served projections must match the committed tree: served_head=$served_head committed_head=$committed_head (committed projections are stale)" >&2
            exit 1
          fi
          for path in attestations/latest/index.json attestations/latest/chain_head.json \
            attestations/latest/binding.json attestations/latest/scores.json attestations/chain-index.json \
            .attestations/chain_head.json; do
            if [[ ! -f "_site/$path" ]] || ! cmp -s "$accepted_root/$path" "_site/$path"; then
              echo "::error title=Attestation projection mismatch::served projections must match the committed tree: $path served_head=$served_head committed_head=$committed_head" >&2
              exit 1
            fi
          done

      - name: Exclude oversized Pages assets before upload
        run: |
          set -Eeuo pipefail
          python3 scripts/check_pages_asset_sizes.py _site

      - name: Guard Cloudflare Pages file ceiling
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path

          files = [path for path in Path('_site').rglob('*') if path.is_file()]
          groups = Counter(path.relative_to('_site').parts[0] for path in files)
          largest, largest_count = groups.most_common(1)[0]
          count = len(files)
          print(f'Cloudflare Pages artifact: {count} files; largest directory {largest}: {largest_count} files')
          # Two thousand slots leave room for more than four 448-file appends.
          if count > 18000:
              raise SystemExit(f'::error title=Cloudflare Pages file ceiling::artifact has {count} files (guard 18000, platform limit 20000); largest directory {largest}: {largest_count} files')
          PY

      - name: Record deterministic release artifact manifest
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py create \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"

      - name: Install preview release invariant dependencies
        run: python -m pip install jsonschema --requirement mcp/requirements.txt

      - name: Verify release artifact before preview deployment
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py verify \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"

      - name: Publish health artifacts to isolated preview KV
        env:
          # Requires Workers KV Storage Write on the deployment account.
          DATAPULSE_KV_WRITE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATAPULSE_KV_PUBLICATION_STATE: ${{ runner.temp }}/preview-health-kv-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -Eeuo pipefail
          # Reuse the VPS publisher and its complete key set, but target only
          # the preview binding. Never fall back to the production namespace.
          DATAPULSE_KV_NAMESPACE_ID="$(python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          config = tomllib.loads(Path("wrangler.toml").read_text())

          def namespace(section: dict) -> str:
              matches = [item["id"] for item in section["kv_namespaces"]
                         if item.get("binding") == "DATAPULSE_HEALTH_INDEX"]
              if len(matches) != 1 or re.fullmatch(r"[0-9a-f]{32}", matches[0]) is None:
                  raise SystemExit("Missing or invalid health KV namespace")
              return matches[0]

          preview = namespace(config["env"]["preview"])
          if preview in {namespace(config), namespace(config["env"]["production"])}:
              raise SystemExit("Preview health KV must be isolated from production")
          print(preview)
          PY
          )"
          export DATAPULSE_KV_NAMESPACE_ID
          # The Pages size guard can exclude history_daily.json from _site.
          # Publish the complete source set, tied to the assembled snapshot.
          cmp health/latest.json _site/health/latest.json
          python3 scripts/publish_health_index.py --health health/latest.json

      - name: Deploy isolated Cloudflare Pages preview artifact
        id: deploy_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4; do
            output="$(mktemp)"
            set +e
            npx --yes wrangler@3.90.0 pages deploy _site --project-name=datapulse-p4b-preview --branch=staging 2>&1 | tee "$output"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -eq 0 ]]; then
              rm -f "$output"
              exit 0
            fi
            if ! grep -q "10429" "$output"; then
              echo "::error title=Cloudflare Pages preview deploy failed::non-rate-limit failure on attempt $attempt; not retrying."
              rm -f "$output"
              exit "$status"
            fi
            rm -f "$output"
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error title=Cloudflare Pages preview deploy rate limited::rate limit 10429 persisted after $attempt attempts."
              exit "$status"
            fi
            delay="$((attempt * 60))"
            echo "::warning title=Cloudflare Pages preview deploy rate limited::rate limit 10429 on attempt $attempt; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Install pinned Cosign verifier for preview served verification
        if: needs.sign_health.outputs.signed == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Verify isolated Pages preview before production promotion
        run: |
          set -Eeuo pipefail
          preview_branch="staging"
          preview_origin="https://${preview_branch}.datapulse-p4b-preview.pages.dev"
          bash scripts/verify_served_release.sh \
            --base-url "$preview_origin" \
            --site _site \
            --sigstore-signed "${{ needs.sign_health.outputs.signed }}" \
            --health-only "${{ needs.sign_health.outputs.health_only }}" \
            --sigstore-publication "$RUNNER_TEMP/sigstore-publication" \
            --source-commit "$PROMOTION_SOURCE_SHA" \
            --cosign "$(command -v cosign || true)"

      - name: Verify release artifact after preview served verification
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py verify \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"

      - name: Verify release artifact before canonical production deployment
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py verify \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"

      - name: Deploy canonical Cloudflare Pages artifact
        id: deploy
        # Production is promoted only after the staging deploy in this same run
        # succeeded, so a failed staging deploy can never be bypassed here.
        if: steps.deploy_preview.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4; do
            output="$(mktemp)"
            set +e
            npx --yes wrangler@3.90.0 pages deploy _site --project-name=datapulse-p4b-preview --branch=main --commit-hash="$PROMOTION_SOURCE_SHA" 2>&1 | tee "$output"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -eq 0 ]]; then
              rm -f "$output"
              exit 0
            fi
            if ! grep -q "10429" "$output"; then
              echo "::error title=Cloudflare Pages production deploy failed::non-rate-limit failure on attempt $attempt; not retrying."
              rm -f "$output"
              exit "$status"
            fi
            rm -f "$output"
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error title=Cloudflare Pages production deploy rate limited::rate limit 10429 persisted after $attempt attempts."
              exit "$status"
            fi
            delay="$((attempt * 60))"
            echo "::warning title=Cloudflare Pages production deploy rate limited::rate limit 10429 on attempt $attempt; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Install pinned Cosign verifier
        if: needs.sign_health.outputs.signed == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Verify canonical served surface
        run: |
          set -Eeuo pipefail
          website_origin="$(jq -er '.origins.website | select(type == "string" and test("^https://[^/]+$"))' config/public-surfaces.json)"
          bash scripts/verify_served_release.sh \
            --base-url "$website_origin" \
            --site _site \
            --sigstore-signed "${{ needs.sign_health.outputs.signed }}" \
            --health-only "${{ needs.sign_health.outputs.health_only }}" \
            --sigstore-publication "$RUNNER_TEMP/sigstore-publication" \
            --source-commit "$PROMOTION_SOURCE_SHA" \
            --cosign "$(command -v cosign || true)"

      - name: Verify local versus served parity after publication
        run: python3 scripts/verify_local_public_parity.py --root .

  publication_freshness:
    name: Check production publication freshness
    needs: [deploy]
    # A skipped deploy must not leave an aging production site silently green.
    if: always()
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure canonical production deployment age
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          timestamp=""
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            if response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/datapulse-p4b-preview")"; then
              if timestamp="$(jq -er 'select(.success == true) | .result.canonical_deployment | select(.environment == "production" and .latest_stage.name == "deploy" and .latest_stage.status == "success") | .created_on | select(type == "string" and length > 0)' <<< "$response")"; then
                :
              else
                timestamp=""
              fi
            fi
          fi
          status=0
          verdict="$(python3 scripts/publication_freshness_gate.py --timestamp "$timestamp" --max-age-hours 24)" || status=$?
          case "$status" in
            0) echo "$verdict" ;;
            1) echo "::error title=Stalled production publication::$verdict"; exit 1 ;;
            2) echo "::warning title=Production publication freshness unknown::$verdict; Pages API credentials or deployment metadata may be unavailable. Freshness is not verified." ;;
            *) echo "::error title=Publication freshness gate failed::Unexpected gate exit $status"; exit "$status" ;;
          esac

  publication_chain:
    name: Decide bounded publication successor
    needs: [classify, sign_health, deploy, publication_freshness]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/publication_chain.py
          sparse-checkout-cone-mode: false
      - name: Decide whether a newer main needs publication
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RESULT: ${{ needs.deploy.result == 'success' && needs.publication_freshness.result == 'success' && 'success' || 'failure' }}
          PUBLISHED_SHA: ${{ needs.sign_health.outputs.settled_sha }}
          CHAIN_DEPTH: ${{ github.event.inputs.chain_depth }}
        run: |
          set -Eeuo pipefail
          # Only workflow_run lacks the dispatch input; never repair bad dispatch input.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            CHAIN_DEPTH=0
          fi
          main_sha=""
          if [[ "$PUBLICATION_RESULT" == "success" ]]; then
            if ! main_sha="$(timeout -k 5s 60s gh api \
              "repos/$GITHUB_REPOSITORY/commits/refs/heads/main" \
              --header "Cache-Control: no-cache" --jq '.sha')"; then
              main_sha=""
            fi
          fi
          # This only detects movement. The successor reuses classify + settlement
          # inside the unchanged lock; no SHA is selected or passed here.
          if ! verdict="$(jq -n \
            --arg publication_result "$PUBLICATION_RESULT" \
            --arg published_sha "$PUBLISHED_SHA" --arg main_sha "$main_sha" \
            --arg chain_depth "$CHAIN_DEPTH" --arg max_depth "$PUBLICATION_CHAIN_MAX_DEPTH" \
            '{publication_result: $publication_result, published_sha: $published_sha,
              main_sha: $main_sha, chain_depth: $chain_depth, max_depth: $max_depth}' \
            | python3 scripts/publication_chain.py)"; then
            verdict='{"decision":"stop","reason":"decision_unavailable","next_depth":null}'
          fi
          echo "$verdict"
          jq -r '"decision=\(.decision)\nreason=\(.reason)\nnext_depth=\(.next_depth // "")"' \
            <<< "$verdict" >> "$GITHUB_OUTPUT"

      - name: Dispatch one bounded successor
        id: successor
        if: success() && !cancelled() && steps.chain.outputs.decision == 'chain' && needs.deploy.result == 'success' && needs.publication_freshness.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEPTH: ${{ steps.chain.outputs.next_depth }}
        run: |
          set -Eeuo pipefail
          # One request, no retries: an ambiguous response must not duplicate work.
          # workflow_dispatch still shares the single pending slot with arrivals.
          timeout -k 5s 60s gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloudflare-pages.yml/dispatches" \
            -f ref=main -f "inputs[chain_depth]=$NEXT_DEPTH"

      - name: Summarize publication successor
        if: always()
        env:
          DECISION: ${{ steps.chain.outputs.decision }}
          REASON: ${{ steps.chain.outputs.reason }}
          NEXT_DEPTH: ${{ steps.chain.outputs.next_depth }}
          DISPATCH_OUTCOME: ${{ steps.successor.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "$DECISION" == "chain" && "$DISPATCH_OUTCOME" == "success" ]]; then
            printf 'Publication successor: chain (%s); dispatched depth %s.\n' \
              "$REASON" "$NEXT_DEPTH" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DECISION" == "chain" ]]; then
            printf 'Publication successor: stop (dispatch_%s); no retry.\n' \
              "${DISPATCH_OUTCOME:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Publication successor: stop (%s).\n' \
              "${REASON:-decision_unavailable}" >> "$GITHUB_STEP_SUMMARY"
          fi
