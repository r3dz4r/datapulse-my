name: Verify pull request preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uncredentialed PR Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install release verification dependencies
        run: python -m pip install jsonschema --requirement mcp/requirements.txt 'datacontract-cli[duckdb]==0.12.5'

      - name: Build release artifact
        env:
          DATAPULSE_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DATAPULSE_SOURCE_COMMIT_DATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          signer_dir="$(mktemp -d "$RUNNER_TEMP/datapulse-preview-signer.XXXXXX")"
          export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE="$signer_dir/private-key.json"
          trap 'rm -f "$DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE"; rmdir "$signer_dir"' EXIT
          preview_key_id="$(python3 scripts/init_keys.py \
            --private-key "$DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE" \
            --registry docs/.well-known/datapulse-probe-keys.json \
            --purpose attestation-chain-signing --lifetime-days 1)"
          python3 - "$preview_key_id" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.gen_attestations import reuse_existing_day

          root = Path.cwd()
          day = datetime.now(timezone.utc).date().isoformat()
          registry_path = root / "docs/.well-known/datapulse-probe-keys.json"
          registry = json.loads(registry_path.read_text())
          # Preserve historical public rows: an immutable same-day set may reuse
          # its original signature rather than use the temporary private key.
          if reuse_existing_day(root, day):
              binding = json.loads((root / "attestations" / day / "binding.json").read_text())
              registry["current_key_id"] = binding["payload"]["ed25519"]["key_id"]
              print("Preview reuses verified immutable same-day attestations; no temporary signature claimed.")
          else:
              registry["current_key_id"] = sys.argv[1]
              print("Preview prepared a temporary signing identity for fresh attestations.")
          registry_path.write_text(json.dumps(registry, indent=2) + "\n")
          PY
          export DATAPULSE_SOURCE_COMMIT_DATE="$(git show -s --format=%cs "$DATAPULSE_SOURCE_COMMIT_SHA")"
          bash scripts/generate.sh release-build
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.gen_attestations import reuse_existing_day

          if not reuse_existing_day(Path.cwd(), datetime.now(timezone.utc).date().isoformat()):
              raise SystemExit("Preview build did not produce a verifiable dated attestation set")
          print("Preview attestation signatures verified against the preserved public registry.")
          PY
          python3 scripts/gen_per_dataset_receipt.py
          bash scripts/run_datacontract_validation.sh
          python3 scripts/verify_release_reproducible.py \
            --workdir-root "$RUNNER_TEMP" \
            --output docs/release-verification.md
          python3 scripts/verify_release_reproducible.py \
            --verify-proof docs/release-verification.md
          bash scripts/verify_release_invariants.sh --local

      - name: Assemble canonical Pages artifact
        run: |
          set -Eeuo pipefail
          rm -rf _site
          mkdir -p _site/.well-known
          cp -R docs/. _site/
          cp llms.txt robots.txt sitemap.xml feed.xml datapulse.json datapulse_summary.json custodians.json datapulse.schema.json health.schema.json agent.schema.json mcp.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json _site/
          cp -R health deltas record-evidence badges samples data _site/
          if [ -d observation-receipts ]; then cp -R observation-receipts _site/; fi
          cp -R attestations _site/
          cp -R .attestations _site/
          cp docs/.well-known/datapulse-probe-keys.json _site/.well-known/
          test -s _site/index.html
          test -s _site/404.html
          test "$(grep -c '[^[:space:]]' _site/_redirects)" -ge 4
          grep -qxF '/methodology /health-methodology 301' _site/_redirects
          grep -qxF '/trust-contract /trust-contract.md 301' _site/_redirects
          grep -qxF '/okf/ /okf/index.md 301' _site/_redirects
          grep -qxF '/okf /okf/index.md 301' _site/_redirects
          test -s _site/health/latest.json
          private_scan_status=0
          grep -RqE 'private_key_base64|BEGIN ([A-Z0-9]+ )?PRIVATE KEY' _site || private_scan_status=$?
          if [[ "$private_scan_status" != 1 ]]; then
            echo "::error::Pages artifact contains private signing material or could not be scanned." >&2
            exit 1
          fi

      - name: Check Pages asset sizes
        run: python3 scripts/check_pages_asset_sizes.py _site

      - name: Record and verify release artifact manifest
        env:
          DATAPULSE_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_artifact.py create \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$DATAPULSE_SOURCE_COMMIT_SHA"
          python3 scripts/verify_release_artifact.py verify \
            --site _site \
            --manifest "$RUNNER_TEMP/release-artifact-manifest.json" \
            --source-commit "$DATAPULSE_SOURCE_COMMIT_SHA"

      - name: Package verified static artifact
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          # Transfer data only: no source scripts, signer, or deploy configuration.
          test ! -e _site/functions
          test ! -e _site/_worker.js
          test ! -e _site/wrangler.toml
          test ! -e _site/wrangler.json
          test ! -e _site/wrangler.jsonc
          mkdir -p "$RUNNER_TEMP/preview-artifact"
          mv _site "$RUNNER_TEMP/preview-artifact/_site"
          cp "$RUNNER_TEMP/release-artifact-manifest.json" "$RUNNER_TEMP/preview-artifact/"
          private_scan_status=0
          grep -rE 'private_key_base64|BEGIN ([A-Z0-9]+ )?PRIVATE KEY' "$RUNNER_TEMP/preview-artifact" >/dev/null || private_scan_status=$?
          if [[ "$private_scan_status" != 1 ]]; then
            echo "::error::Preview upload contains private material or could not be scanned." >&2
            exit 1
          fi
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "preview-artifact"
          members = list(root.rglob("*"))
          if len(members) > 25000:
              raise SystemExit("Preview member limit")
          total = 0
          for path in members:
              mode = path.lstat().st_mode
              if not stat.S_ISDIR(mode) and not stat.S_ISREG(mode):
                  raise SystemExit("Preview must contain regular static files only")
              parts = path.relative_to(root).parts
              if set(parts) & {"functions", "_worker.js", "_routes.json", "wrangler.toml", "wrangler.json", "wrangler.jsonc", ".git", ".github", "node_modules", "package.json", "package-lock.json", ".npmrc"}:
                  raise SystemExit("Preview contains deployment or executable configuration")
              if stat.S_ISDIR(mode):
                  continue
              if path.suffix.lower() not in {".html", ".md", ".json", ".jsonl", ".gz", ".txt", ".xml", ".css", ".js", ".svg", ".png", ".jpg", ".jpeg", ".ico", ".csv", ".zip", ".pb", ".ipynb"} and path.name not in {"_headers", "_redirects"}:
                  raise SystemExit("Unexpected preview static file type")
              size = path.stat().st_size
              total += size
              if size > 25 * 1024 * 1024 or total > 512 * 1024 * 1024:
                  raise SystemExit("Preview size limit")
              if re.search(rb"private_key_base64|BEGIN ([A-Z0-9]+ )?PRIVATE KEY", path.read_bytes()):
                  raise SystemExit("Private material in preview")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          binding = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pr_number": event["number"],
              "head_sha": os.environ["PREVIEW_HEAD_SHA"],
              "workflow": "Verify pull request preview",
              "event": "pull_request",
              "manifest_sha256": hashlib.sha256((root / "release-artifact-manifest.json").read_bytes()).hexdigest(),
          }
          (root / "preview-binding.json").write_text(json.dumps(binding, sort_keys=True) + "\n")
          PYTHON
      - name: Upload verified static artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: preview-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
