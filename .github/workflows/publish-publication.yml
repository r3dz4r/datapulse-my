name: Build canonical Pages publication
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "mcp/**"
      - "functions/**"
      - "observation-receipts/**"
      - "attestations/**"
      - "config/public-surfaces.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/publish-publication.yml"
      - "datapulse.json"
      - "mcp.json"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: read
# No promotion concurrency here: build completion, not commit arrival, queues
# the locked workflow. Only that consumer may witness or append evidence.
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PROMOTION_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | sed -n '1p'

      - name: Install release verification dependencies
        run: |
          python -m pip install jsonschema --requirement mcp/requirements.txt 'datacontract-cli[duckdb]==0.12.5'

      - name: Run release-build generation profile (non-health path)
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          export DATAPULSE_SOURCE_COMMIT_SHA="$PROMOTION_SOURCE_SHA"
          export DATAPULSE_SOURCE_COMMIT_DATE="$(git show -s --format=%cs "$PROMOTION_SOURCE_SHA")"
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          bash scripts/generate.sh release-build

      - name: Generate dataset passports
        # data/passports/ is build output, not tracked; generate it from the built inputs.
        run: |
          set -Eeuo pipefail
          rm -rf data/passports
          python3 scripts/gen_dataset_passports.py
          expected="$(jq -er '.datasets | length' datapulse.json)"
          actual="$(find data/passports -maxdepth 1 -type f -name '*.json' ! -name index.json | wc -l)"
          if [[ "$actual" -ne "$expected" ]] || ! jq -e --argjson n "$expected" '.dataset_count == $n' data/passports/index.json >/dev/null; then
            echo "::error title=Dataset passports incomplete::generated $actual passports for $expected manifest datasets"
            exit 1
          fi

      - name: Generate per-dataset evidence statements (release artifact)
        run: |
          python3 scripts/gen_per_dataset_receipt.py

      - name: Validate DataPulse contract (non-health path)
        run: |
          bash scripts/run_datacontract_validation.sh

      - name: Verify full release contract (non-health path)
        env:
          DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT: ${{ secrets.DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" ]]; then
            echo "$DATAPULSE_ATTESTATION_PRIVATE_KEY_CONTENT" > /tmp/datapulse-attestation-key.json
            chmod 600 /tmp/datapulse-attestation-key.json
            export DATAPULSE_ATTESTATION_PRIVATE_KEY_FILE=/tmp/datapulse-attestation-key.json
          fi
          python3 scripts/verify_release_reproducible.py \
            --workdir-root "$RUNNER_TEMP" \
            --output docs/release-verification.md
          python3 scripts/verify_release_reproducible.py \
            --verify-proof docs/release-verification.md
          bash scripts/verify_release_invariants.sh --local

      - name: Stage only generated publication inputs
        run: |
          set -Eeuo pipefail
          build="$RUNNER_TEMP/pages-build"
          mkdir -p "$build/workspace"
          # Never export a build's private candidate into the signing checkout
          # or durable history. Only the locked consumer submits one append.
          cp -R docs health deltas record-evidence badges samples data "$build/workspace/"
          cp README.md llms.txt robots.txt sitemap.xml feed.xml datapulse.json datapulse_summary.json custodians.json datapulse.schema.json health.schema.json agent.schema.json mcp.schema.json record-evidence.schema.json agent.json mcp.json catalog-snapshot.json catalog-graph.json changelog.json "$build/workspace/"
          python3 scripts/verify_release_artifact.py create \
            --site "$build/workspace" \
            --manifest "$build/manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"
          python3 scripts/verify_release_artifact.py verify \
            --site "$build/workspace" \
            --manifest "$build/manifest.json" \
            --source-commit "$PROMOTION_SOURCE_SHA"

      - name: Pack verified per-commit release build
        run: |
          set -Eeuo pipefail
          tar -C "$RUNNER_TEMP/pages-build" -cf "$RUNNER_TEMP/pages-build.tar" .

      - name: Upload verified per-commit release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-build.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
