name: Attestation Append Merge

# The deploy submits immutable witness evidence through an app-authored pull
# request. The required CI check attaches to that PR before auto-merge can land it.
on:
  push:
    branches:
      - attestation/append-*
  workflow_run:
    workflows: ["Pull request CI"]
    types: [completed]
    branches:
      - attestation/append-*
  # Push events target attestation/append-* refs, which production's branch policy
  # rejects before any protected job step runs - the rejection carries zero steps
  # and a protection-rule annotation. That policy is therefore checked first, and
  # only an admitted ref proceeds to mint the app token. Completed CI runs use
  # the default branch ref; the hourly schedule remains a fallback.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  # contents: write and pull-requests: write enable app-authored PR promotion.
  # The PR triggers its required CI check.
  contents: write
  pull-requests: write

concurrency:
  group: attestation-append-merge
  cancel-in-progress: false

jobs:
  check_production_ref:
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.policy.outputs.admitted }}
    steps:
      - name: Check production deployment branch policy
        id: policy
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          environment="$(curl --fail-with-body --silent --show-error --max-time 10 "https://api.github.com/repos/${GH_REPO}/environments/production")"
          policies="$(curl --fail-with-body --silent --show-error --max-time 10 "https://api.github.com/repos/${GH_REPO}/environments/production/deployment-branch-policies?per_page=100")"
          if ! jq -e '.deployment_branch_policy == {"protected_branches": false, "custom_branch_policies": true}' <<<"$environment" >/dev/null; then
            echo "::error title=Production policy changed::Cannot determine whether this ref can deploy to production."
            exit 1
          fi
          # The two observed exact rules are the only policy shape this decision handles.
          if ! jq -e '.total_count == 2 and ([.branch_policies[].name] | sort) == ["health-automation", "main"]' <<<"$policies" >/dev/null; then
            echo "::error title=Production policy changed::Expected only health-automation and main deployment branch policies."
            exit 1
          fi
          if jq -e --arg ref "$GITHUB_REF_NAME" 'any(.branch_policies[]; .name == $ref)' <<<"$policies" >/dev/null; then
            echo "admitted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Production branch policy refusal::Branch \"$GITHUB_REF_NAME\" is not allowed to deploy to production due to environment protection rules."
            echo "admitted=false" >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: check_production_ref
    if: >-
      needs.check_production_ref.outputs.admitted == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout append branch
        uses: actions/checkout@v4
        with:
          # Read-only checkout; this workflow never writes to any branch.
          persist-credentials: false

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Select oldest open append pull request
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pull_requests="${RUNNER_TEMP}/append-prs.json"

          gh pr list --base main --state open --limit 1000 \
            --json number,headRefName,createdAt,title,state,mergeable,statusCheckRollup > "$pull_requests"

          # submit_attestation_append.sh pushes the branch before creating its PR.
          # Wait briefly for that PR on push; scheduled runs select from main.
          # Whether the hourly schedule can start this production job remains
          # unverified until its first scheduled run.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            for attempt in {1..10}; do
              if jq -e --arg head "$GITHUB_REF_NAME" \
                'any(.[]; .headRefName == $head)' "$pull_requests" >/dev/null; then
                break
              fi
              if (( attempt < 10 )); then
                sleep 3
                gh pr list --base main --state open --limit 1000 \
                  --json number,headRefName,createdAt,title,state,mergeable,statusCheckRollup > "$pull_requests"
              fi
            done
          fi

          if ! jq -e 'any(.[]; .headRefName | startswith("attestation/append-"))' \
            "$pull_requests" >/dev/null; then
            echo "No open attestation append pull request; nothing to do."
            exit 0
          fi

          number="$(python3 scripts/select_append_candidate.py "$pull_requests")"
          if [[ -z "$number" ]]; then
            echo "No eligible attestation append pull request; waiting for compatible evidence and checks."
            exit 0
          fi
          selected_head="$(jq -r --argjson number "$number" \
            '.[] | select(.number == $number) | .headRefName' "$pull_requests")"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$selected_head" != "$GITHUB_REF_NAME" ]]; then
            echo "Waiting append $GITHUB_REF_NAME; oldest append is #$number ($selected_head)."
            exit 0
          fi
          echo "Selected pull request #$number for $selected_head."
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.candidate.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="${{ steps.candidate.outputs.number }}"

          # 39 sleeps * 30s = 1170s; the 30m timeout leaves 630s of margin.
          max_attempts="${ARM_MAX_ATTEMPTS:-40}"
          retry_seconds="${ARM_RETRY_SECONDS:-30}"

          # Retry only unstable/queued/expected required checks, matching ruleset
          # refusals, and transient HTTP 5xx responses.
          is_retryable() {
            local output="$1"
            if grep -qiF 'pull request is in unstable status (enablePullRequestAutoMerge)' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'required status check "?deterministic-safety-net"? .*is (queued|expected)' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'repository rule violations found' <<<"$output" && \
               grep -qiE 'required status check' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'http[^0-9]*5[0-9][0-9]' <<<"$output"; then
              return 0
            fi
            return 1
          }

          attempt=1
          last_error=""
          while (( attempt <= max_attempts )); do
            if state="$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest != null' 2>&1)"; then
              if [[ "$state" == "true" ]]; then
                echo "Auto-merge already enabled on pull request #$number (attempt $attempt/$max_attempts)."
                exit 0
              fi
            else
              last_error="$state"
              if ! is_retryable "$state"; then
                echo "$state"
                echo "::error title=Auto-merge state unreadable::Could not read auto-merge state for pull request #$number."
                exit 1
              fi
            fi

            if merge_output="$(gh pr merge "$number" --auto --squash 2>&1)"; then
              echo "Auto-merge enabled on pull request #$number on attempt $attempt/$max_attempts."
              exit 0
            fi

            last_error="$merge_output"
            if ! is_retryable "$merge_output"; then
              echo "$merge_output"
              echo "::error title=Auto-merge refused::gh pr merge refused auto-merge on pull request #$number with a non-retryable error."
              exit 1
            fi

            echo "::warning title=Auto-merge retry::Attempt $attempt/$max_attempts to arm auto-merge on #$number was refused as retryable; retrying in ${retry_seconds}s."
            if (( attempt < max_attempts )); then
              sleep "$retry_seconds"
            fi
            attempt=$(( attempt + 1 ))
          done

          echo "::error title=Auto-merge never armed::Gave up after $max_attempts attempts to arm auto-merge on pull request #$number; last error: $last_error"
          exit 1

      - name: Close same-day superseded append pull requests
        if: steps.candidate.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          merged_number="${{ steps.candidate.outputs.number }}"
          # Auto-merge being armed is not proof that the merge landed. Wait for
          # GitHub to report MERGED before closing any sibling evidence branch.
          for attempt in {1..40}; do
            state="$(gh pr view "$merged_number" --json state --jq '.state')"
            if [[ "$state" == "MERGED" ]]; then
              break
            fi
            if (( attempt == 40 )); then
              echo "::warning title=Append merge pending::PR #$merged_number has not merged; leaving sibling PRs open."
              exit 0
            fi
            sleep 30
          done

          pull_requests="${RUNNER_TEMP}/append-prs-after-merge.json"
          gh pr list --base main --state open --limit 1000 \
            --json number,headRefName,createdAt,title,state > "$pull_requests"
          gh pr view "$merged_number" --json number,headRefName,createdAt,title,state > "${pull_requests}.merged"
          jq --slurp '.[0] + [.[1]]' "$pull_requests" "${pull_requests}.merged" > "${pull_requests}.all"
          siblings="$(python3 - "$pull_requests" "$merged_number" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.select_append_candidate import select_superseded_siblings

          rows = json.loads(Path(sys.argv[1] + ".all").read_text(encoding="utf-8"))
          for number in select_superseded_siblings(rows, int(sys.argv[2])):
              print(number)
          PY
          )"
          for sibling in $siblings; do
            if ! gh pr comment "$sibling" --body "Superseded by merged append #$merged_number. The branch is kept as evidence." || \
               ! gh pr close "$sibling"; then
              echo "::warning title=Sibling close failed::Could not close superseded PR #$sibling; merge #$merged_number succeeded."
            fi
          done
