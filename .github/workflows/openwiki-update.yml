name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write
  # openwiki writes a new workflow file to the repo as part of its refresh; allow it.
  workflows: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenWiki
        run: npm install -g openwiki

      # OpenWiki reads credentials from ~/.openwiki/.env in non-interactive mode.
      # The README's example workflow writes that file before invoking openwiki.
      # See https://github.com/langchain-ai/openwiki/blob/main/openwiki/operations/credentials-and-updates.md
      - name: Write OpenWiki credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.openwiki
          # Use printf so the secret is expanded by the shell, not the heredoc.
          printf 'OPENWIKI_PROVIDER=openrouter\nOPENROUTER_API_KEY=%s\nOPENWIKI_MODEL_ID=z-ai/glm-5.2\n' "$OPENROUTER_API_KEY" > ~/.openwiki/.env
          chmod 600 ~/.openwiki/.env

      - name: Run OpenWiki
        run: |
          set -a
          source ~/.openwiki/.env
          set +a
          openwiki code --update --print
        env:
          # Telemetry off per repo owner preference.
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "docs: openwiki weekly refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit"
          fi
