name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenWiki
        run: npm install -g openwiki

      # OpenWiki reads credentials from ~/.openwiki/.env in non-interactive mode.
      # The README's example workflow writes that file before invoking openwiki.
      # See https://github.com/langchain-ai/openwiki/blob/main/openwiki/operations/credentials-and-updates.md
      - name: Write OpenWiki credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.openwiki
          # Use printf so the secret is expanded by the shell, not the heredoc.
          printf 'OPENWIKI_PROVIDER=openrouter\nOPENROUTER_API_KEY=%s\nOPENWIKI_MODEL_ID=z-ai/glm-5.2\n' "$OPENROUTER_API_KEY" > ~/.openwiki/.env
          chmod 600 ~/.openwiki/.env

      - name: Run OpenWiki
        run: |
          set -a
          source ~/.openwiki/.env
          set +a
          openwiki code --update --print
        env:
          # Telemetry off per repo owner preference.
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Commit and push if changed
        # openwiki sometimes re-renders its own .github/workflows/openwiki-update.yml
        # and may emit AGENTS.md/CLAUDE.md marker files. Stage only OpenWiki-owned
        # paths (openwiki/ + datapulse.json) and ignore any other pending changes
        # (workflow self-rewrites + marker files) so the auto-commit still passes
        # cleanly when OpenWiki produced no content diff.
        run: |
          git add openwiki/ 2>/dev/null || true
          git add datapulse.json 2>/dev/null || true
          # Count only the paths we actually stage; if nothing in those two paths
          # changed, exit cleanly without pushing an empty commit.
          if [[ -n "$(git status --porcelain -- openwiki/ datapulse.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: openwiki weekly refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit (workflow self-rewrite or markers ignored)"
          fi
