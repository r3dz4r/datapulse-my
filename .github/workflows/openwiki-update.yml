name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

# OpenWiki is intentionally manual/weekly, never a production-push dependency.

permissions:
  contents: write
  # pull-requests: write lets the action open/update the PR and `gh pr merge
  # --auto` enable auto-merge; actions: write lets `gh workflow run` dispatch
  # ci.yml against the PR branch.
  pull-requests: write
  actions: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up locked Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/openwiki/package-lock.json

      - name: Install project-local OpenWiki
        run: npm ci --prefix tools/openwiki

      # A missing secret used to surface as a bare "ChatGPT token request
      # failed (401)", which reads like a bad token. Fail first and name the
      # unprovisioned variable so the fix is obviously a repo-secret change.
      - name: Preflight ChatGPT credentials
        env:
          OPENAI_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENAI_CHATGPT_ACCESS_TOKEN }}
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_EXPIRES_AT: ${{ secrets.OPENAI_CHATGPT_EXPIRES_AT }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
          OPENAI_CHATGPT_EMAIL: ${{ secrets.OPENAI_CHATGPT_EMAIL }}
          OPENAI_CHATGPT_PLAN: ${{ secrets.OPENAI_CHATGPT_PLAN }}
        run: |
          missing=()
          for name in \
            OPENAI_CHATGPT_ACCESS_TOKEN \
            OPENAI_CHATGPT_REFRESH_TOKEN \
            OPENAI_CHATGPT_EXPIRES_AT \
            OPENAI_CHATGPT_ACCOUNT_ID \
            OPENAI_CHATGPT_EMAIL \
            OPENAI_CHATGPT_PLAN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=ChatGPT credentials not provisioned::${missing[*]} is empty. The secret is not provisioned for this repository; repository secrets (Settings > Secrets and variables > Actions) are the fix, not a code change."
            exit 1
          fi
          echo "ChatGPT credential preflight passed: all six secrets are provisioned."

      # Generation runs on OpenAI via ChatGPT OAuth (openai-chatgpt, gpt-5.6-luna),
      # drawing on the ChatGPT/Codex plan allowance instead of a metered API key.
      # Known failure mode: this route refuses with HTTP 429 once the plan's
      # usage limit is reached. The switch was reversed once before, on
      # 2026-08-29, for exactly that reason; re-check the plan allowance before
      # changing it back.
      - name: Write OpenWiki credentials
        env:
          OPENWIKI_PROVIDER: openai-chatgpt
          OPENWIKI_MODEL_ID: gpt-5.6-luna
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENAI_CHATGPT_ACCESS_TOKEN }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
          OPENAI_CHATGPT_EMAIL: ${{ secrets.OPENAI_CHATGPT_EMAIL }}
          OPENAI_CHATGPT_EXPIRES_AT: ${{ secrets.OPENAI_CHATGPT_EXPIRES_AT }}
          OPENAI_CHATGPT_PLAN: ${{ secrets.OPENAI_CHATGPT_PLAN }}
        run: |
          umask 077
          mkdir -p ~/.openwiki
          printf 'OPENWIKI_PROVIDER=openai-chatgpt\n' > ~/.openwiki/.env
          printf 'OPENWIKI_MODEL_ID=gpt-5.6-luna\n' >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_REFRESH_TOKEN=%s\n' "$OPENAI_CHATGPT_REFRESH_TOKEN" >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_ACCESS_TOKEN=%s\n' "$OPENAI_CHATGPT_ACCESS_TOKEN" >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_ACCOUNT_ID=%s\n' "$OPENAI_CHATGPT_ACCOUNT_ID" >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_EMAIL=%s\n' "$OPENAI_CHATGPT_EMAIL" >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_EXPIRES_AT=%s\n' "$OPENAI_CHATGPT_EXPIRES_AT" >> ~/.openwiki/.env
          printf 'OPENAI_CHATGPT_PLAN=%s\n' "$OPENAI_CHATGPT_PLAN" >> ~/.openwiki/.env
          chmod 600 ~/.openwiki/.env

      - name: Generate derivative OpenWiki documentation
        env:
          OPENWIKI_PROVIDER: openai-chatgpt
          OPENWIKI_MODEL_ID: gpt-5.6-luna
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENAI_CHATGPT_ACCESS_TOKEN }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
          OPENAI_CHATGPT_EMAIL: ${{ secrets.OPENAI_CHATGPT_EMAIL }}
          OPENAI_CHATGPT_EXPIRES_AT: ${{ secrets.OPENAI_CHATGPT_EXPIRES_AT }}
          OPENAI_CHATGPT_PLAN: ${{ secrets.OPENAI_CHATGPT_PLAN }}
          OPENWIKI_TELEMETRY_DISABLED: "1"
        run: npm exec --prefix tools/openwiki -- openwiki code --update --print

      - name: Inject canonical facts and verify generated pages
        # Combined step: the deterministic injector must run BEFORE the
        # verifier so the verifier never sees the model's raw output
        # (the model's first pass may emit claims the injector will strip,
        # e.g. "122 datasets"). Running them sequentially in one shell
        # also avoids the GitHub-Actions parallel-execution race that
        # broke the previous run.
        run: |
          python3 scripts/inject_openwiki_canonical_facts.py --root .
          python3 scripts/verify_openwiki.py --generated --changed-from HEAD

      - name: Create or update OpenWiki pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: openwiki/update
          delete-branch: true
          commit-message: "docs: refresh OpenWiki derivative documentation"
          title: "docs: refresh OpenWiki derivative documentation"
          body: |
            Generated with the project-local, locked OpenWiki runtime.
            The normal deterministic-safety-net must pass before merge.
          # The managed OpenWiki block inside the two agent doctrine files is
          # generator-owned, but publishing doctrine from an unattended job
          # skips review, so those files are deliberately updated by hand.
          # Only the five openwiki/ artefacts are published.
          add-paths: |
            openwiki/quickstart.md
            openwiki/datasets.md
            openwiki/mcp.md
            openwiki/operations.md
            openwiki/.last-update.json

      # The action pushes the branch with this workflow's own GITHUB_TOKEN, and
      # GitHub does not trigger workflows for token pushes. ci.yml therefore
      # never starts from that push and the required "deterministic-safety-net"
      # check would never report on the branch head, leaving the pull request
      # permanently unmergeable. Dispatch ci.yml explicitly against the lane
      # branch so the required check attaches to that commit.
      - name: Dispatch required check on the pull request branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref openwiki/update

      # Do not hold the runner open waiting for CI: auto-merge lets GitHub
      # squash the pull request once the dispatched check passes.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge openwiki/update --auto --squash
