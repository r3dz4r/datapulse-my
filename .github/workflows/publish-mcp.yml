name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# Release Please emits BOTH a tag push and a published release for one version, so this
# workflow runs twice on the same commit and both runs race to publish the same version.
# Observed: the verifier saw 3.23.4 absent at 11:48:18.16, the other run published it, and
# this run's publish was rejected at 11:48:18.44 with "cannot publish duplicate version".
# Serialising the runs means the second reaches the verifier after the first has published
# and exits through the existing "already matches; skipping" path.
concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          # Stamp the release-please manifest version into server.json so
          # mcp-publisher advertises that single authority, not a stale
          # checkout copy of server.json.
          python3 scripts/release_identity.py --write
          VERSION="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          # Content comparison replaces the version-string grep. A live
          # version whose title/description still says "DataPulse MY" / 389
          # must publish, not skip. Exit 2 is unverifiable: never publish.
          set +e
          python3 scripts/verify_registry_distribution.py --check
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "registry entry already matches canonical surfaces; skipping"
            exit 0
          fi
          if [ "$STATUS" -eq 2 ]; then
            echo "cannot determine registry distribution; refusing to publish"
            exit 2
          fi
          if [ "$STATUS" -ne 1 ]; then
            echo "unexpected verifier exit ${STATUS}; refusing to publish"
            exit "$STATUS"
          fi
          echo "Publishing version ${VERSION} to MCP Registry..."
          # The verifier's check and the publish are not atomic, so a concurrent run can
          # publish the same version in between and the registry then rejects this one as a
          # duplicate. Same commit, same content: that is success, not failure. The concurrency
          # group above prevents the common case; this covers a manual re-run of the same tag
          # and any future double-trigger. Every other publish error still fails the step.
          set +e
          ./mcp-publisher publish 2>&1 | tee /tmp/mcp-publish.log
          PUBLISH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if grep -q 'cannot publish duplicate version' /tmp/mcp-publish.log; then
              echo "version ${VERSION} already published by a concurrent run; treating duplicate as a no-op"
            else
              echo "publish failed with status ${PUBLISH_STATUS}"
              exit "$PUBLISH_STATUS"
            fi
          fi

      - name: Reconcile registry lifecycle status
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          python3 scripts/reconcile_registry_status.py \
            --server-name io.github.r3dz4r/datapulse-my \
            --target "$VERSION" \
            --publisher-bin ./mcp-publisher
