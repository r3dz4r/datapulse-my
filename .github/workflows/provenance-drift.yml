name: MCP provenance drift (hourly)

# Served state belongs in an operational audit, outside pull-request CI.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-drift
  cancel-in-progress: false

jobs:
  provenance:
    # Manual runs on topic branches must not compare their records with production.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The expected revision is the newest mcp/ commit, which may predate
          # the checkout tip; a shallow history could produce a false match.
          fetch-depth: 0

      - name: Compare expected and served MCP provenance
        id: verify
        shell: bash
        env:
          MCP_ENDPOINT: https://mcp.data-pulse.my/mcp
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/verify_mcp_deployment.py \
            --repo-path "$GITHUB_WORKSPACE" \
            --default-branch "$DEFAULT_BRANCH" \
            --endpoint "$MCP_ENDPOINT" > "$RUNNER_TEMP/provenance-drift.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/provenance-drift.txt"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          {
            echo '### Expected versus served MCP provenance'
            printf 'Verifier exit code: %s\n\n' "$status"
            echo '```text'
            cat "$RUNNER_TEMP/provenance-drift.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) exit 0 ;;
            1)
              echo '::error title=MCP provenance mismatch::The served source differs from the newest mcp/ revision on the default branch.'
              exit 1
              ;;
            2)
              echo '::warning title=MCP provenance unverified::Endpoint unreachable; no mismatch established. The next scheduled run will check again.'
              exit 0
              ;;
            *)
              echo "::error title=MCP provenance verifier error::Unexpected exit code $status."
              exit "$status"
              ;;
          esac

      # Existing scheduled audits have no in-tree notification hook. Keep one
      # open issue per incident and mention the owner when it is first created.
      - name: Notify repository owner of provenance mismatch
        if: failure() && steps.verify.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'MCP expected-versus-served provenance drift';
            const evidence = fs.readFileSync(`${process.env.RUNNER_TEMP}/provenance-drift.txt`, 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `@${context.repo.owner} the live MCP source differs from the newest mcp/ revision on the default branch.`,
              '',
              `Latest check: ${runUrl}`,
              '',
              '```text',
              evidence.trim(),
              '```',
              '',
              'This audit reports drift; it does not rewrite mcp.json or deploy anything.',
              'Investigate the record and deployment, then close this issue after a matching check.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
