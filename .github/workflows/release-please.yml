name: Release Please

on:
  push:
    branches:
      - main
    paths-ignore:
      - "health/**"
      - "badges/**"
      - "deltas/**"
      - "record-evidence/**"
      - "feed.xml"
      - "data/**"

# Cancel in-flight runs when a new push lands. Without this, a burst of
# timer pushes (every ~5 min) spawns parallel release-please runs that
# all hit the GitHub App installation rate limit simultaneously
# (~60 req/hr per install). 12 of 31 recent runs failed with
# "API rate limit exceeded for installation" because of this
# amplification; with cancel-in-progress only one run is in-flight at
# a time and the limit is rarely hit.
concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          fetch-depth: 0
      - name: Assert and publish attestation anchor
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          anchored="$(git show "$TAG:.attestations/chain_head.json" | jq -er .chain_head)"
          [[ "$anchored" =~ ^[0-9a-f]{64}$ ]]
          body="$(gh release view "$TAG" --json body --jq '.body // ""')"
          body="$(printf '%s\n' "$body" | sed -E '/^Attestation-Chain-Head: [0-9a-f]{64}$/d')"
          gh release edit "$TAG" --notes "${body}

          Attestation-Chain-Head: ${anchored}"
          gh release view "$TAG" --json body --jq .body | grep -Fq "Attestation-Chain-Head: $anchored"
