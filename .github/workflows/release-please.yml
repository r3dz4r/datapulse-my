name: Release Please

on:
  push:
    branches:
      - main

# Cancel in-flight runs when a new push lands. Without this, a burst of
# timer pushes (every ~5 min) spawns parallel release-please runs that
# all hit the GitHub App installation rate limit simultaneously
# (~60 req/hr per install). 12 of 31 recent runs failed with
# "API rate limit exceeded for installation" because of this
# amplification; with cancel-in-progress only one run is in-flight at
# a time and the limit is rarely hit.
concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      health_only: ${{ steps.classify.outputs.health_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          echo "health_only=false" >> "$GITHUB_OUTPUT"
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || exit 0
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | python3 scripts/classify_change.py; then
            echo "health_only=true" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: classify
    if: needs.classify.outputs.health_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          fetch-depth: 0
      - name: Assert and publish attestation anchor
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          anchored="$(git show "$TAG:.attestations/chain_head.json" | jq -er .chain_head)"
          [[ "$anchored" =~ ^[0-9a-f]{64}$ ]]
          body="$(gh release view "$TAG" --json body --jq '.body // ""')"
          body="$(printf '%s\n' "$body" | sed -E '/^Attestation-Chain-Head: [0-9a-f]{64}$/d')"
          gh release edit "$TAG" --notes "${body}

          Attestation-Chain-Head: ${anchored}"
          gh release view "$TAG" --json body --jq .body | grep -Fq "Attestation-Chain-Head: $anchored"
