name: Health Automation Merge

# The VPS pipeline publishes to the health-automation branch because the main
# ruleset (id 20884049, bypass_actors: []) refuses a direct push whose required
# deterministic-safety-net check has not yet run (GH013). Nothing else promotes
# that branch, so without this workflow health commits pile up on
# health-automation and the published snapshot goes stale.
#
# This job opens (or reuses) the health-automation -> main pull request and
# turns on auto-merge, so GitHub performs the merge once the PR's own required
# check passes. It never writes to main itself.

on:
  push:
    branches:
      - health-automation
  # Push runs on the non-main ref are held pending with zero jobs by the
  # platform. Scheduled runs use main, where production jobs start normally.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  # contents: write mirrors openwiki-update.yml; pull-requests: write lets the
  # run open/update the PR and enable auto-merge. No actions permission is
  # needed: the app-authored PR triggers ci.yml by itself, so nothing dispatches
  # a workflow.
  contents: write
  pull-requests: write

concurrency:
  # Renamed from `health-automation-merge` on 2026-10-09. That group reached a
  # state where no run ever started: 16 runs in one hour, every one cancelled with
  # zero jobs, including a workflow_dispatch issued from the default branch - while
  # an identically shaped lane in its own group started and finished in 18s.
  # Because nothing in the group ever became *running*, each new arrival cancelled
  # the pending member and the queue livelocked for 43 hours. Renaming abandons the
  # jammed group state. cancel-in-progress stays false so an in-flight promotion is
  # never killed by the 5-minute push flood - safe because a run completes in ~18s
  # and therefore rarely leaves anything queued to contend for the slot.
  group: health-automation-merge-v2
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: health-automation
          # Read-only checkout; this workflow must never write to any branch.
          persist-credentials: false

      # A PR authored by the workflow's own GITHUB_TOKEN does not trigger its
      # own pull_request runs, so the required deterministic-safety-net check
      # would never attach and auto-merge would wait forever. An app-authored PR
      # runs CI normally and the required check reports on the branch head by
      # itself. The app credentials already exist and openwiki-update.yml and
      # release-please.yml use them too.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check for health commits to promote
        id: delta
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ahead_by="$(gh api "repos/$GH_REPO/compare/main...health-automation" --jq '.ahead_by')"
          if [[ ! "$ahead_by" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid comparison::Could not read the health-automation commit count ahead of main."
            exit 1
          fi
          if [[ "$ahead_by" == "0" ]]; then
            echo "No health commits to promote."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A squash merge leaves the original branch commits ahead in history.
          # Its merged PR head records whether this exact branch tip was promoted.
          head_sha="$(git rev-parse HEAD)"
          last_merged_head="$(gh pr list --head health-automation --base main \
            --state merged --limit 1 --json headRefOid --jq '.[0].headRefOid // empty')"
          if [[ -n "$last_merged_head" && "$head_sha" == "$last_merged_head" ]]; then
            echo "No health commits to promote; branch tip was already merged."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=true" >> "$GITHUB_OUTPUT"

      # Reuse the open PR when one already exists so a fresh push updates it
      # instead of opening a duplicate.
      - name: Open or reuse the automation pull request
        if: steps.delta.outputs.pending == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="main"
          head="health-automation"

          number="$(gh pr list --head "$head" --base "$base" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            url="$(gh pr create --base "$base" --head "$head" \
              --title "chore(health): merge health-automation into main" \
              --body "Automated promotion of the health-automation branch. The main ruleset refuses a direct push before the required deterministic-safety-net check has run, so the pipeline publishes here and this pull request carries the change into main. Auto-merge is enabled; the branch is intentionally not deleted because the pipeline keeps publishing to it.")"
            number="${url##*/}"
            echo "Opened pull request #$number for $head -> $base."
          else
            echo "Reusing open pull request #$number for $head -> $base."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Auto-merge is the whole point: without it the PR sits forever and the
      # staleness merely moves from the pipeline to the branch. gh pr merge
      # --auto fails loudly if GitHub will not enable auto-merge, so this never
      # silently skips. Guarded so a repeated push while auto-merge is already
      # on stays idempotent.
      - name: Enable auto-merge
        if: steps.delta.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          if [[ -z "$number" ]]; then
            echo "::error title=No pull request::Could not resolve the open health-automation -> main pull request."
            exit 1
          fi

          # Bounded retry budget, tunable from the step environment without
          # editing the loop. The merge job's timeout-minutes must comfortably
          # exceed max_attempts * retry_seconds.
          max_attempts="${ARM_MAX_ATTEMPTS:-20}"
          retry_seconds="${ARM_RETRY_SECONDS:-30}"

          # Retryable: the required check is queued or expected but not yet
          # reported (the measured refusal was "Repository rule violations
          # found" with 'Required status check "deterministic-safety-net" is
          # queued.'), plus transient API failures (HTTP 5xx, secondary rate
          # limit). Anything else is fatal on the first attempt.
          is_retryable() {
            local output="$1"
            if grep -qiE 'required status check "?deterministic-safety-net"? .*is (queued|expected)' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'repository rule violations found' <<<"$output" && \
               grep -qiE 'required status check' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'http[^0-9]*5[0-9][0-9]' <<<"$output"; then
              return 0
            fi
            if grep -qiE 'secondary rate limit|rate limit exceeded|abuse detection' <<<"$output"; then
              return 0
            fi
            return 1
          }

          attempt=1
          last_error=""
          while (( attempt <= max_attempts )); do
            if state="$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest != null' 2>&1)"; then
              if [[ "$state" == "true" ]]; then
                echo "Auto-merge already enabled on pull request #$number (attempt $attempt/$max_attempts)."
                exit 0
              fi
            else
              last_error="$state"
              if ! is_retryable "$state"; then
                echo "$state"
                echo "::error title=Auto-merge state unreadable::Could not read auto-merge state for pull request #$number."
                exit 1
              fi
            fi

            if merge_output="$(gh pr merge "$number" --auto --squash 2>&1)"; then
              echo "Auto-merge enabled on pull request #$number on attempt $attempt/$max_attempts."
              exit 0
            fi

            last_error="$merge_output"
            if ! is_retryable "$merge_output"; then
              echo "$merge_output"
              echo "::error title=Auto-merge refused::gh pr merge refused auto-merge on pull request #$number with a non-retryable error."
              exit 1
            fi

            echo "::warning title=Auto-merge retry::Attempt $attempt/$max_attempts to arm auto-merge on #$number was refused as retryable; retrying in ${retry_seconds}s."
            if (( attempt < max_attempts )); then
              sleep "$retry_seconds"
            fi
            attempt=$(( attempt + 1 ))
          done

          echo "::error title=Auto-merge never armed::Gave up after $max_attempts attempts to arm auto-merge on pull request #$number; last error: $last_error"
          exit 1
