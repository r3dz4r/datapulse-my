# Install as /etc/logrotate.d/datapulse-stages.
# The writer also moves events older than one day into dated JSONL files;
# logrotate bounds the active heartbeat, alert, and dated archive files.
/home/redza/datapulse-my/var/log/stages.jsonl /home/redza/datapulse-my/var/log/stages.*.jsonl /var/log/datapulse-stages.jsonl /var/log/heartbeat-FAIL /var/log/datapulse-health.err {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
