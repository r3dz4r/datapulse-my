# Buyer API is private: expose this virtual host only on the Tailscale listener.
limit_req_zone $binary_remote_addr zone=datapulse_api:10m rate=5r/s;

server {
    listen 100.64.0.1:443 ssl http2;
    server_name api.datapulse-my.my;

    ssl_certificate     /etc/nginx/tls/datapulse-api.crt;
    ssl_certificate_key /etc/nginx/tls/datapulse-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 256k;

    # Defence in depth; the application enforces the billable per-key limit.
    location ^~ /api/v1/ {
        limit_req zone=datapulse_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
