map $http_origin $datapulse_mcp_origin_denied {
    default                       1;
    ""                            0;
    "https://datapulse.my"       0;
    "https://www.datapulse.my"   0;
    "https://r3dz4r.github.io"   0;
}

limit_req_zone $binary_remote_addr zone=datapulse_mcp:10m rate=1r/s;

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name mcp.data-pulse.my;

    ssl_certificate     /etc/nginx/tls/datapulse-mcp.crt;
    ssl_certificate_key /etc/nginx/tls/datapulse-mcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 256k;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location = /mcp {
        if ($datapulse_mcp_origin_denied) {
            return 403;
        }

        limit_req zone=datapulse_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8788/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 2026-10-09: the engine MCP has been paused since 2026-09-22 and nothing listens on
    # 8790, so proxying here produced a bare Cloudflare 502. Every registry, transparency
    # log and research crawler that enumerates this hostname read that as a broken service
    # (one observer collected 502s daily for 30 days). A deliberate 503 with Retry-After and
    # a JSON-RPC error body is an explicit "intentionally unavailable" signal that also
    # points a client at the surface that IS served. Replace this block when the engine
    # surface is served again.
    location /engine {
        default_type application/json;
        add_header Retry-After 3600 always;
        return 503 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"engine surface paused since 2026-09-22; the DataPulse MCP is served at https://mcp.data-pulse.my/mcp"}}';
    }

    location / {
        return 404;
    }
}
