map $http_origin $datapulse_mcp_origin_denied {
    default                       1;
    ""                            0;
    "https://datapulse.my"       0;
    "https://www.datapulse.my"   0;
    "https://r3dz4r.github.io"   0;
}

limit_req_zone $binary_remote_addr zone=datapulse_mcp:10m rate=1r/s;

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name mcp.datapulse-my.my;

    ssl_certificate     /etc/nginx/tls/datapulse-mcp.crt;
    ssl_certificate_key /etc/nginx/tls/datapulse-mcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 256k;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location = /mcp {
        if ($datapulse_mcp_origin_denied) {
            return 403;
        }

        limit_req zone=datapulse_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8788/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
